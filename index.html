<style>
:root{
  --bg:#060a14; --panel:#0f1729; --panel2:#131d35; --line:#22305a; --text:#e8eeff; --muted:#8e9bc2; --dim:#5d6a90;
  --green:#3dff8b; --red:#ff4d6d; --amber:#ffb627; --cyan:#3de0ff; --purple:#b48cff; --idle:#7d8bb0; --teal:#3ff2d0;
  --mono: ui-monospace,"SFMono-Regular","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Noto Sans",sans-serif;
  --side: 340px;
}
@media (min-width:1480px){ :root{ --side: 384px; } }
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--sans); color:var(--text);
  background:
    radial-gradient(1100px 500px at 50% -15%, #22388055, transparent 70%),
    radial-gradient(700px 400px at 0% 110%, #0f4a3533, transparent 70%),
    radial-gradient(700px 400px at 100% 110%, #4a1f6a33, transparent 70%),
    var(--bg);
  background-attachment:fixed;
  min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);
  background-size:24px 24px;}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,#00000000 0 2px,#00000014 2px 3px);mix-blend-mode:multiply;}
button{font:inherit;color:inherit}

/* ---------------- HUD ---------------- */
.hud{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:10px 18px;
  background:linear-gradient(180deg,#101a33f5,#0b1226f2);border-bottom:1px solid var(--line);
  box-shadow:0 6px 30px #0008, 0 1px 0 #3de0ff22 inset;backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-badge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 50% 35%,#2a3f88,#111a38);border:1px solid #3de0ff55;
  box-shadow:0 0 16px #3de0ff44, inset 0 0 12px #3de0ff22}
.brand-badge svg{width:26px;height:26px}
.brand h1{margin:0;white-space:nowrap;font-family:var(--mono);font-size:17px;letter-spacing:.18em;font-weight:800;
  background:linear-gradient(90deg,#9ff3ff,#c8b5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted);white-space:nowrap}
.stats{margin-left:auto;display:flex;gap:7px;flex-wrap:nowrap;justify-content:flex-end;min-width:0}
.stat{display:flex;align-items:center;gap:8px;padding:5px 11px;border-radius:9px;background:#0a1124;border:1px solid var(--line);min-width:0}
.stat .ico{width:17px;height:17px;flex:none;opacity:.9;display:grid}
.stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.stat .v{font-family:var(--mono);font-size:14px;font-weight:700;line-height:1.2;white-space:nowrap}
.stat .v small{font-size:10.5px;color:var(--muted);font-weight:500}
.stat.ok .v{color:var(--green)} .stat.warn .v{color:var(--amber)}
.stat.alert{cursor:pointer;border-color:#ffb62777;box-shadow:0 0 14px #ffb62733;animation:alertGlow 2.2s ease-in-out infinite}
.stat.alert .v{color:var(--amber)}
.stat.alert:hover{background:#1a1608}
@keyframes alertGlow{50%{box-shadow:0 0 24px #ffb62766}}
.live{display:inline-flex;align-items:center;gap:4px;margin-left:5px;padding:0 5px;border-radius:4px;border:1px solid #3dff8b66;color:var(--green);letter-spacing:.12em;vertical-align:1px}
.live i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;animation:pulse 1.6s ease-in-out infinite;--c:var(--green)}
.live b{font-weight:700;font-size:9px}
.live.stale,.live.off{color:#8a93ad;border-color:#56607e}
.live.stale i,.live.off i{animation:none;box-shadow:none;opacity:.7}

/* ---------------- LAYOUT ---------------- */
.ops{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:minmax(0,1fr) var(--side);gap:14px;padding:14px 18px 8px;align-items:start}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.side{display:flex;flex-direction:column;gap:14px;min-width:0;position:sticky;top:76px;max-height:calc(100vh - 90px)}
.card{position:relative;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#0f1830f0,#0a1124f0);
  box-shadow:0 10px 30px #0007, inset 0 1px 0 #ffffff08;--cc:var(--cyan)}
.card-head{display:flex;align-items:center;gap:10px;padding:11px 14px 9px;border-bottom:1px solid #1b2647}
.card-head h2{margin:0;font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--cc);
  text-shadow:0 0 12px color-mix(in srgb,var(--cc) 50%,transparent);white-space:nowrap}
.card-head .ico{width:16px;height:16px;flex:none;display:grid}
.card-head .sub{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid currentColor}

/* ---------------- INBOX ---------------- */
.inbox{--cc:var(--amber)}
.inbox.clear{--cc:var(--green)}
.inbox.has{border-color:#ffb62766;box-shadow:0 10px 30px #0007,0 0 22px #ffb62722}
.inbox ul{list-style:none;margin:0;padding:6px}
.ib{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;
  padding:7px 8px;border-radius:10px;border:1px solid transparent}
.ib:hover{background:#1d1708;border-color:#ffb62744}
.ib:focus-visible{outline:2px solid var(--amber)}
.mini{width:34px;height:34px;border-radius:9px;display:grid;place-items:end center;overflow:hidden;flex:none;
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--zc,#3de0ff) 28%,#0b1228),#070c1c 80%);
  border:1px solid color-mix(in srgb,var(--zc,#3de0ff) 55%,transparent)}
.mini svg{width:24px;height:32px;image-rendering:pixelated;margin-bottom:-1px}
.ib .t{min-width:0}
.ib .t b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib .t span{display:block;font-size:12px;color:#ffe2a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib .age{font-family:var(--mono);font-size:10px;color:var(--amber);text-align:right;white-space:nowrap}
.ib .age small{display:block;color:var(--dim);font-size:9px;letter-spacing:.1em}
.allclear{display:flex;align-items:center;gap:10px;padding:14px;color:var(--green);font-family:var(--mono);font-size:12px}
.allclear svg{width:22px;height:22px;flex:none}
.allclear span{color:var(--muted);font-family:var(--sans);display:block;font-size:11.5px;margin-top:2px}

/* ---------------- FEED ---------------- */
.feed{--cc:var(--cyan);display:flex;flex-direction:column;min-height:0;flex:1}
.feed ol{list-style:none;margin:0;padding:4px 6px 8px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#2a3866 transparent}
.fi{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:10px;width:100%;padding:8px;border-radius:10px;position:relative}
.fi:hover{background:#111c38}
.fi:focus-visible{outline:2px solid var(--cyan)}
.fi + .fi::before{content:"";position:absolute;left:24px;top:-5px;height:8px;border-left:1px dashed #2a3866}
.fi .meta{display:flex;align-items:baseline;gap:8px;min-width:0}
.fi .meta b{font-size:12.5px;color:var(--zc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .meta time{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
.fi p{margin:2px 0 0;font-size:12px;line-height:1.4;color:#d6def6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fi p.fd{color:var(--muted);font-size:11.5px}
.fi p.fd::before{content:"▸ ";color:var(--zc)}
.empty-note{padding:14px;color:var(--dim);font-size:12px;font-style:italic}

/* ---------------- WORLD ---------------- */
.world{display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:auto}
.world .zone{min-height:222px}
.locked.slim{min-height:0;flex-direction:row;padding:10px 16px;gap:14px;justify-content:center}
.locked.slim .lock{width:28px;height:28px}
.world .zone.row1{min-height:244px}
.zone{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);isolation:isolate;display:flex;flex-direction:column;--zc:#3de0ff}
.zone::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--zc) 25%,transparent), inset 0 0 40px color-mix(in srgb,var(--zc) 10%,transparent)}
.zone{container-type:inline-size}
@container (max-width:300px){ .zone-head p{display:none} .zone-head h2{font-size:10.5px;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis} .zone-head{gap:6px;padding-left:8px;padding-right:8px} .zone-icon{width:24px;height:24px} .zone-icon svg{width:15px;height:15px} .zone-count{display:none} .zone-count .zl{display:none} .zone-head{padding-top:12px} }
.zone-art{position:absolute;inset:0;z-index:-1}
.zone-art svg{width:100%;height:100%;display:block}
.zone-art::after{content:"";position:absolute;inset:0 0 auto 0;height:84px;background:linear-gradient(180deg,#000a,transparent);pointer-events:none}
.zone-head{display:flex;align-items:center;gap:9px;padding:10px 12px 0;position:relative;z-index:3}
.zone-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:#0009;border:1px solid color-mix(in srgb,var(--zc) 55%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--zc) 35%,transparent)}
.zone-icon svg{width:17px;height:17px}
.zone-head h2{margin:0;font-family:var(--mono);font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--zc);white-space:nowrap;
  text-shadow:0 0 12px color-mix(in srgb,var(--zc) 60%,transparent)}
.zone-head p{margin:1px 0 0;font-size:11px;color:#c7d0eccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zone-head > div{min-width:0}
.zone-count{margin-left:auto;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:99px;background:#000a;
  border:1px solid color-mix(in srgb,var(--zc) 40%,transparent);color:#dfe6ff;white-space:nowrap}
.flag-banner{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:2px;background:var(--zc);box-shadow:0 0 8px var(--zc)}
.theme-stocks{--zc:var(--green);background:linear-gradient(180deg,#04201c 0%,#08202c 55%,#061019 100%);border-color:#1d5f4b}
.theme-hq{--zc:var(--purple);background:linear-gradient(180deg,#160f3a 0%,#120c2c 60%,#0a0918 100%);border-color:#4a3a8a}
.theme-realestate{--zc:var(--amber);background:linear-gradient(180deg,#2b1a3e 0%,#4a2c45 38%,#6b3d3a 62%,#1a3324 100%);border-color:#7a5636}
.theme-studio{--zc:#ff5fd2;background:linear-gradient(180deg,#1a0b2e 0%,#2a1040 55%,#120a20 100%);border-color:#7a3a8a}
.flow{position:relative;z-index:3;margin:8px 12px 0;display:flex;align-items:center;justify-content:center;gap:6px;height:22px;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.flow-st{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;background:#0009;border:1px solid #ff5fd266;color:#ffd6f6;cursor:pointer;white-space:nowrap}
.flow-st .dot{width:7px;height:7px}
.flow-st:hover{border-color:#ff5fd2}
.flow-arr{display:inline-flex;gap:3px}
.flow-arr i{width:4px;height:4px;background:#ff5fd2;border-radius:1px;animation:flowdot 1.2s linear infinite;opacity:.25}
.flow-arr i:nth-child(2){animation-delay:.2s} .flow-arr i:nth-child(3){animation-delay:.4s}
@keyframes flowdot{0%,100%{opacity:.25}30%{opacity:1;box-shadow:0 0 6px #ff5fd2}}
.theme-studio .units{justify-content:center;gap:6px}
.theme-studio .unit{flex:0 1 150px}
.flowarrow{animation:blink 1.6s ease-in-out infinite}
.theme-ailab{--zc:#7c9cff;background:linear-gradient(180deg,#0a0f2a 0%,#0d1438 60%,#080c22 100%);border-color:#34428a}
.theme-fairway{--zc:#ff8fc8;background:linear-gradient(180deg,#0f2a3a 0%,#1d4a52 40%,#2f6a46 70%,#123a24 100%);border-color:#3f8a5a}
.theme-puppy{--zc:#ff9f6b;background:linear-gradient(180deg,#2a1420 0%,#3a1e28 40%,#4a2a1a 70%,#1a1018 100%);border-color:#8a4a3a}
.theme-games{--zc:#c04dff;background:linear-gradient(180deg,#0b0424 0%,#2a0b4a 45%,#3a1060 70%,#0e0420 100%);border-color:#6a3aa8}
.theme-familyoffice{--zc:#d4a537;background:linear-gradient(180deg,#2a1a10 0%,#3a2414 50%,#1a0f08 100%);border-color:#7a5a2a}
.theme-dance{--zc:#ff6bcb;background:linear-gradient(180deg,#2a0a24 0%,#4a1038 45%,#1a0818 100%);border-color:#8a3a6a}
.unit.lead .sprite-wrap{width:62px;height:82px}
.unit.lead .sprite{width:58px;height:77px}
.lead-tag{display:inline-block;margin-left:4px;padding:0 4px;border-radius:3px;background:#ff5fd2;color:#1a0b2e;font-family:var(--mono);font-size:8px;font-weight:800;letter-spacing:.08em;vertical-align:2px}
.flow-lead{border-color:#ffd44788;color:#ffe9a8}
.flow-sep{width:1px;height:14px;background:#ff5fd266;margin:0 4px}
.theme-travel{--zc:var(--teal);background:linear-gradient(180deg,#0c2a4a 0%,#1b4f7a 45%,#f2a65a 78%,#e9cf98 100%);border-color:#2a7a8a}

.tape{position:relative;z-index:3;margin:8px 0 0;height:20px;overflow:hidden;background:#000a;border-block:1px solid #3dff8b33;
  font-family:var(--mono);font-size:10.5px;line-height:20px;white-space:nowrap;letter-spacing:.08em}
.tape-inner{display:inline-block;animation:tape 40s linear infinite}
.tape span{margin-right:26px;color:#bdf7d6}
.tape .up{color:var(--green)} .tape .dn{color:var(--red)}
@keyframes tape{to{transform:translateX(-50%)}}

.zbody{position:relative;z-index:4;flex:1;display:flex;align-items:flex-end;gap:12px;padding:6px 10px 12px;min-height:0}
.units{flex:1;display:flex;align-items:flex-end;justify-content:space-evenly;gap:8px;min-width:0}
.theme-hq .units{flex:0 0 auto}
.unit{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;width:min(158px,100%);flex:0 1 158px;
  border-radius:12px;padding:4px 2px 0;transition:transform .15s ease}
.unit:hover{transform:translateY(-3px)}
.unit:focus-visible{outline:2px solid var(--zc);outline-offset:3px}
.sprite-wrap{position:relative;width:56px;height:74px;display:flex;align-items:flex-end;justify-content:center}
.unit.boss .sprite-wrap{width:68px;height:90px}
.sprite{width:52px;height:69px;image-rendering:pixelated;animation:bob 2.6s ease-in-out infinite;
  filter:drop-shadow(0 0 6px color-mix(in srgb,var(--eye,#3de0ff) 45%,transparent)) drop-shadow(0 3px 0 #0006)}
.unit.boss .sprite{width:63px;height:84px}
.sprite.duo{width:106px;height:63px}
.sprite-wrap:has(> svg.duo){width:110px}
.sprite-wrap:has(> svg.duo) .shadow{width:88px;margin-left:-44px}
.sprite-wrap:has(> svg.duo) .ring{width:104px;margin-left:-52px}
.mini svg.duo{width:32px;height:19px;margin-bottom:3px}
.tl-label .mini svg.duo{width:21px;height:12.5px}
.portrait svg.duo{width:88px;height:52px}
.shadow{position:absolute;bottom:-3px;left:50%;width:40px;height:8px;margin-left:-20px;border-radius:50%;background:#0009;animation:shadow 2.6s ease-in-out infinite;filter:blur(1px)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.85}50%{transform:scaleX(.8);opacity:.55}}
.unit:hover .sprite{animation-duration:1.1s}
.quest{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:14px;height:21px;animation:questBob 1.1s ease-in-out infinite;filter:drop-shadow(0 0 6px #ffb627)}
@keyframes questBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
.ring{position:absolute;bottom:-6px;left:50%;width:56px;height:14px;margin-left:-28px;border-radius:50%;
  border:2px solid color-mix(in srgb,var(--zc) 70%,transparent);opacity:0;transition:opacity .2s}
.unit:hover .ring,.unit.selected .ring{opacity:1;animation:ring 1.4s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.12);opacity:.5}}
.sprite-wrap .dot{position:absolute;top:2px;right:-4px;width:10px;height:10px;border:2px solid #050913}
.plate{width:100%;background:linear-gradient(180deg,#0b1228f2,#070c1cf2);border:1px solid color-mix(in srgb,var(--zc) 40%,#22305a);
  border-radius:10px;padding:6px 6px 7px;box-shadow:0 6px 18px #0009, 0 0 14px color-mix(in srgb,var(--zc) 12%,transparent)}
.plate .name{font-weight:700;font-size:12px;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.plate .cls{font-family:var(--mono);font-size:9.5px;color:var(--muted);text-align:center;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xprow{display:flex;align-items:center;gap:5px;margin-top:5px;font-family:var(--mono);font-size:9px;color:var(--dim)}
.xprow b{color:#ffe08a;font-weight:700}
.xp{flex:1;height:5px;border-radius:3px;background:#1a2442;overflow:hidden;border:1px solid #2a3866}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#ffd447,#ff9f1c);box-shadow:0 0 8px #ffd447}
.strow{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase}
.st{display:flex;align-items:center;gap:5px;white-space:nowrap;min-width:0}
.st .dot{width:8px;height:8px}
.hb{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;color:var(--hc)}
.hb svg{width:10px;height:10px;flex:none}
.h-healthy{--hc:var(--green)} .h-late{--hc:var(--red)} .h-quiet{--hc:var(--idle)}
.hb.h-healthy svg{animation:beat 1.3s ease-in-out infinite}
.hb.h-late svg{animation:beat .7s ease-in-out infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}20%{transform:scale(1.3)}40%{transform:scale(.95)}}

.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 8px var(--c),0 0 2px var(--c)}
.s-active{--c:var(--green)} .s-working{--c:var(--cyan)} .s-needs{--c:var(--amber)} .s-setup{--c:var(--purple)} .s-idle{--c:var(--idle)}
.st.s-active{color:var(--green)} .st.s-working{color:var(--cyan)} .st.s-needs{color:var(--amber)} .st.s-setup{color:var(--purple)} .st.s-idle{color:var(--idle)}
.dot.s-active{animation:pulse 2s ease-in-out infinite}
.dot.s-needs{animation:pulse .9s ease-in-out infinite}
.dot.s-setup{animation:blink 2.8s ease-in-out infinite}
.dot.s-working{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 16px 3px var(--c);transform:scale(1.15)}}
@keyframes blink{50%{opacity:.35}}

/* HQ briefing */
.brief{flex:1;min-width:0;align-self:stretch;margin:4px 2px 2px;border-radius:12px;padding:10px 12px 9px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0d0a24e8,#0a0819f0);border:1px solid #6b55c288;box-shadow:0 0 22px #7b5cff22, inset 0 0 18px #7b5cff14}
.brief h3{margin:0 0 7px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--purple);display:flex;align-items:center;gap:7px}
.brief h3 i{width:6px;height:6px;border-radius:1px;background:var(--purple);box-shadow:0 0 8px var(--purple);animation:blink 1.6s steps(2) infinite}
.brief ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.brief li{display:flex;gap:8px;font-size:12.5px;line-height:1.38;color:#e2dcff}
.brief li::before{content:"›";font-family:var(--mono);color:var(--purple);font-weight:700}
.brief li b{color:#fff}
.brief .bfoot{margin-top:auto;padding-top:7px;font-family:var(--mono);font-size:9.5px;color:#7d74a8}

/* locked zones */
.locked{min-height:0;border:1.5px dashed #33416d;background:repeating-linear-gradient(135deg,#0c1328 0 12px,#0a1022 12px 24px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:14px;
  border-radius:14px;color:var(--muted);position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.locked:hover{border-color:#5a6cab;transform:translateY(-2px)}
.locked::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 50%,#ffffff0d,transparent 40%),radial-gradient(circle at 70% 60%,#ffffff0a,transparent 35%);animation:fog 14s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(12%)}}
.locked .lock{width:38px;height:38px;opacity:.8;position:relative}
.locked h3{margin:0;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#aeb9dd;position:relative}
.locked p{margin:0;font-size:11.5px;color:var(--dim);position:relative}

/* ---------------- TIMELINE ---------------- */
.timeline{--cc:var(--cyan)}
.tl-sum{display:flex;gap:6px;margin-left:6px}
.pill{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid #2a3866;color:var(--muted);white-space:nowrap}
.pill.g{color:var(--green);border-color:#3dff8b55} .pill.c{color:var(--cyan);border-color:#3de0ff55} .pill.r{color:var(--red);border-color:#ff4d6d66}
.pill.q{color:var(--purple);border-color:#b48cff55}
.tl-legend{margin-left:auto;display:flex;gap:12px;font-family:var(--mono);font-size:9.5px;color:var(--dim);white-space:nowrap}
.tl-legend span{display:inline-flex;align-items:center;gap:5px}
.tl-body{padding:6px 14px 10px}
.tl-grid{position:relative;display:grid;grid-template-columns:164px 1fr;row-gap:4px}
.tl-axis{grid-column:2;position:relative;height:16px;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.tl-axis span{position:absolute;transform:translateX(-50%);top:0}
.tl-label{display:flex;align-items:center;gap:8px;min-width:0;height:26px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.tl-label .mini{width:22px;height:22px;border-radius:6px}
.tl-label .mini svg{width:15px;height:20px}
.tl-label b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dbe3fb}
.tl-label:hover b{color:#fff}
.tl-track{position:relative;height:26px;border-radius:7px;background:linear-gradient(90deg,#0a1124,#0c1530);border:1px solid #1b2647;
  background-image:var(--hours)}
.tl-track .note{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--dim);font-style:italic}
.mk{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;line-height:1;z-index:2}
.mk.done{background:var(--green);color:#03210f;box-shadow:0 0 10px #3dff8b88}
.mk.up{background:#0a1124;border:2px solid var(--cyan);box-shadow:0 0 8px #3de0ff55}
.mk.due{background:#0a1124;border:2px solid var(--amber);box-shadow:0 0 10px #ffb62788;animation:pulse 1s ease-in-out infinite;--c:var(--amber)}
.mk.miss{background:#2a0a12;border:2px solid var(--red);color:var(--red)}
.mk.skip{background:transparent;border:1.5px dashed #56607e}
.mk.sm{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;font-size:0;border-width:1.5px}
.mk.sm.done{box-shadow:0 0 6px #3dff8b88}
.mk.ran{width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:2px;transform:rotate(45deg);background:var(--amber);box-shadow:0 0 8px #ffb627aa;z-index:1}
.lg.mk{position:static;margin:0;display:inline-grid}
.now{position:absolute;top:16px;bottom:0;width:0;border-left:2px solid #ff4d6d;z-index:3;pointer-events:none;box-shadow:0 0 8px #ff4d6d}
.now span{position:absolute;top:-16px;left:-22px;width:44px;text-align:center;font-family:var(--mono);font-size:9px;font-weight:700;color:#fff;
  background:#ff4d6d;border-radius:4px;padding:1px 0}
.tl-foot{margin-top:8px;font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.tl-foot b{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--dim);font-weight:600;margin-right:4px}
.quiet-banner{margin:0 0 6px;padding:7px 10px;border-radius:8px;background:#120f2a;border:1px solid #3a2d80;color:#cbbcff;font-size:12px}

/* footer */
.foot{position:relative;z-index:2;display:flex;align-items:center;gap:16px;padding:6px 18px 12px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .sep{width:1px;height:12px;background:#2a3866}
.foot .note{margin-left:auto}

/* ---------------- PANEL ---------------- */
.backdrop{position:fixed;inset:0;background:#02040acc;backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.backdrop.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:61;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(180deg,#111b34,#0a1124);border-left:1px solid color-mix(in srgb,var(--zc) 45%,#22305a);
  box-shadow:-20px 0 60px #000b, inset 1px 0 0 color-mix(in srgb,var(--zc) 25%,transparent);display:flex;flex-direction:column;--zc:var(--cyan)}
.panel.open{transform:none}
.p-head{display:flex;gap:16px;padding:20px 20px 16px;border-bottom:1px solid var(--line);position:relative}
.portrait{width:96px;height:112px;flex:none;border-radius:12px;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--zc) 25%,#0b1228),#070c1c 75%);
  border:1px solid color-mix(in srgb,var(--zc) 55%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--zc) 25%,transparent)}
.portrait svg{width:66px;height:88px;animation:bob 2.6s ease-in-out infinite;image-rendering:pixelated}
.p-title{min-width:0;flex:1}
.p-zone{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--zc)}
.p-title h2{margin:4px 0 2px;font-size:21px;line-height:1.15}
.p-cls{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  background:#0a1124;border:1px solid var(--line);text-transform:uppercase}
.chip.s-active{color:var(--green);border-color:#3dff8b55} .chip.s-needs{color:var(--amber);border-color:#ffb62766}
.chip.s-setup{color:var(--purple);border-color:#b48cff55} .chip.s-working{color:var(--cyan);border-color:#3de0ff55} .chip.s-idle{color:var(--idle)}
.chip.hb{border-color:color-mix(in srgb,var(--hc) 45%,transparent)}
.close{all:unset;cursor:pointer;position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:#0a1124}
.close:hover{color:#fff;border-color:#4a5c99}
.close:focus-visible{outline:2px solid var(--zc)}
.p-body{padding:16px 20px 20px;overflow:auto;flex:1}
.wait{border:1px solid #ffb62788;background:linear-gradient(180deg,#2a1f08,#1a1406);border-radius:10px;padding:10px 12px;margin-bottom:14px;box-shadow:0 0 18px #ffb62722}
.wait h4{margin:0 0 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--amber)}
.wait ul{margin:0;padding-left:18px;color:#ffe7b3;font-size:13.5px}
.sheet{display:grid;grid-template-columns:110px 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sheet dt,.sheet dd{margin:0;padding:9px 12px;border-bottom:1px solid #1b2647;font-size:13px;line-height:1.45}
.sheet dt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);background:#0a1022;padding-top:11px}
.sheet dd{color:#dbe3fb}
.sheet dt:nth-last-of-type(1),.sheet dd:last-child{border-bottom:none}
.sheet .empty{color:var(--dim);font-style:italic}
.p-foot{margin-top:14px;font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.7}

@media (max-width:1180px){
  .stats .stat.opt{display:none}
}
@media (max-width:1100px){
  .ops{grid-template-columns:1fr}
  .side{position:static;max-height:none;order:-1;display:grid;grid-template-columns:1fr 1fr}
  .feed ol{max-height:360px}
  .hud{flex-wrap:wrap} .stats{flex-wrap:wrap;margin-left:0}
}
@media (max-width:760px){
  .world{grid-template-columns:1fr 1fr}
  .zone{grid-column:span 2 !important}
  .locked{grid-column:1/-1 !important}
  .side{grid-template-columns:1fr}
  .tl-grid{grid-template-columns:96px 1fr}
  .tl-legend{display:none}
  .theme-hq .zbody{flex-direction:column;align-items:stretch}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

</head>
<body>
<header class="hud">
  <div class="brand">
    <div class="brand-badge" id="brandBadge"></div>
    <div>
      <h1>COMMAND CENTER</h1>
      <p id="subtitle"></p>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="ops">
  <div class="main">
    <main class="world" id="world" aria-label="Team world map"></main>
    <section class="card timeline" id="timeline" aria-label="Today's schedule"></section>
  </div>
  <aside class="side">
    <section class="card inbox" id="inbox" aria-label="Needs you inbox"></section>
    <section class="card feed" id="feed" aria-label="Activity feed"></section>
  </aside>
</div>

<footer class="foot">
  <div class="legend" id="legend"></div>
  <div class="note" id="note"></div>
</footer>

<div class="backdrop" id="backdrop"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pName" aria-hidden="true">
  <div class="p-head">
    <div class="portrait" id="pPortrait"></div>
    <div class="p-title">
      <div class="p-zone" id="pZone"></div>
      <h2 id="pName"></h2>
      <div class="p-cls" id="pCls"></div>
      <div class="chips" id="pChips"></div>
    </div>
    <button class="close" id="pClose" aria-label="Close">&#10005;</button>
  </div>
  <div class="p-body" id="pBody"></div>
</aside>

<script>
(function(){
"use strict";
let D = TEAM_DATA;
const TZ = (D.team && D.team.timezone) || "America/Chicago";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- status ---------- */
const STATUS = {
  "active":     {cls:"s-active",  label:"Active"},
  "working":    {cls:"s-working", label:"Working"},
  "needs you":  {cls:"s-needs",   label:"Needs you"},
  "setting up": {cls:"s-setup",   label:"Setting up"},
  "idle":       {cls:"s-idle",    label:"Idle"}
};
const st = s => STATUS[String(s||"").toLowerCase()] || {cls:"s-idle", label:s || "Idle"};

/* ---------- pixel sprites ---------- */
const BASE = [
  "..oooooooo..",
  ".ohhhhhhhho.",
  ".oheehheeho.",
  ".oheehheeho.",
  ".ohhhhhhhho.",
  ".ohhhmmhhho.",
  "..oooooooo..",
  ".oobbbbbboo.",
  "ohobbaabboho",
  "ohobbbbbboho",
  "..oobbbboo..",
  "...oo..oo..."
];
const HATS = {
  crown:       ["..t..tt..t..","..aa.aa.aa..","..aaaaaaaa..","..aaattaaa.."],
  mortarboard: ["............",".aaaaaaaaaa.","...aaaaaa.t.","...aaaaaa.t."],
  antenna:     [".....tt.....",".....oo.....",".....oo.....","....oooo...."],
  fedora:      ["............","...aaaaaa...","...aaaaata..",".aaaaaaaaaa."],
  hardhat:     ["............","....aaaa....","...aatwaa...",".aaaaaaaaaa."],
  none:        ["............","............","............","............"]
};
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const f = v => Math.max(0,Math.min(255,Math.round(v+(amt<0?v*amt:(255-v)*amt))));
  return "#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
/* Two-robot "duo" avatar (Bielik Game Studio): cat bot (left, purple) + puppy bot (right, teal), both holding controllers.
   Used when avatar.type === "duo"; every other avatar still goes through the normal sprite() path. */
const DUO_CAT = [
  ".p....c...p.",
  ".pp...o..pp.",
  ".opoooooopo.",
  ".owwwwwwwwo.",
  ".owsssssswo.",
  "gowscsscswog",
  "gowssccsswog",
  "..oooooooo..",
  ".owwwppwwwo.",
  "wwkkckkbkkww",
  ".okkkkkkkko.",
  "..owwwwwwo..",
  "..oww..wwo..",
  "..opp..ppo.."
];
const DUO_PUP = [
  "......c.....",
  "......o.....",
  "..oooooooo..",
  ".towwwwwwot.",
  "ttwsssssswtt",
  "ttwscsscswtt",
  "ttwsssssswtt",
  ".t.oooooo.t.",
  ".owwwttwwwo.",
  "wwkkckkbkkww",
  ".okkkkkkkko.",
  "..owwwwwwo..",
  "..oww..wwo..",
  "..ott..tto.."
];
function duoSprite(av, cls){
  const cat = av.catAccent||"#b05cff", pup = av.pupAccent||"#19e3c8", eye = av.eye||"#3dfff0";
  const base = { o:"#0a0f1f", w:"#e3e7f5", s:"#0d1030", c:eye, k:"#2a1a4a", b:"#ff5fd2", g:"#c8d3f5" };
  const draw = (rows, dx, pal) => { let r=""; rows.forEach((row,y)=>{ for(let x=0;x<row.length;x++){ const ch=row[x]; if(ch===".") continue;
      r += `<rect x="${x+dx}" y="${y+2}" width="1.02" height="1.02" fill="${pal[ch]}"/>`; } }); return r; };
  let r = draw(DUO_CAT, 1, {...base, p:cat}) + draw(DUO_PUP, 14, {...base, t:pup});
  // head highlights
  r += `<rect x="3" y="5" width="2" height="1" fill="#ffffff" opacity=".8"/><rect x="17" y="5" width="2" height="1" fill="#ffffff" opacity=".8"/>`;
  // cat tail (left, purple tip) + puppy tail (right, teal tip)
  r += `<rect x="0" y="10" width="1" height="3" fill="#c8d3f5"/><rect x="0" y="9" width="1" height="1" fill="${cat}"/>`;
  r += `<rect x="26" y="10" width="1" height="3" fill="#c8d3f5"/><rect x="26" y="9" width="1" height="1" fill="${pup}"/>`;
  return `<svg class="${cls||""} duo" viewBox="0 0 27 16" shape-rendering="crispEdges" style="--eye:${eye}" aria-hidden="true">${r}</svg>`;
}
function sprite(av, cls){
  av = av || {};
  if(av.type==="duo") return duoSprite(av, cls);
  const head = av.head||"#c8d3f5", body = av.body||"#3a6df0";
  const pal = { o:"#0a0f1f", h:head, e:av.eye||"#3de0ff", b:body, a:av.accent||"#ffd447", m:shade(head,-.45), t:av.trim||"#ff4d6d", w:"#f4f1e8" };
  const rows = (HATS[av.hat]||HATS.none).concat(BASE);
  let r = "";
  rows.forEach((row,y)=>{ for(let x=0;x<row.length;x++){ const c=row[x]; if(c===".") continue;
    let fill = pal[c]; if(c==="a" && y===8+4) fill = shade(body,.35); // body chest accent
    r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${fill}"/>`; }});
  // highlights
  r += `<rect x="2" y="5" width="2" height="1" fill="${shade(head,.45)}"/><rect x="3" y="11" width="1" height="1" fill="${shade(body,.3)}"/>`;
  if(av.prop==="clipboard") r += `<rect x="8.5" y="9" width="3.5" height="4.5" fill="#8a5a2a"/><rect x="9" y="9.8" width="2.5" height="3.3" fill="#f4f1e8"/><rect x="9.6" y="8.6" width="1.3" height=".8" fill="#c8d3f5"/><rect x="9.3" y="10.5" width="1.9" height=".35" fill="#5d6a90"/><rect x="9.3" y="11.4" width="1.5" height=".35" fill="#5d6a90"/>`;
  if(av.prop==="golfclub") r += `<rect x="10.4" y="7.2" width=".8" height="1.8" fill="#1b2440"/><rect x="10.6" y="9" width=".45" height="5.6" fill="#c8d3f5"/><rect x="9.3" y="14.4" width="1.8" height=".9" fill="#9fb8d0"/><rect x="1.2" y="14.6" width="1" height="1" fill="#f4f1e8"/>`;
  if(av.prop==="clapper") r += `<rect x="8.2" y="9.2" width="3.6" height="2.4" fill="#1a1018"/><path d="M8.2 9.2 L9.6 7.4 H11.2 L10 9.2Z" fill="#ff9f6b"/><rect x="8.5" y="10.6" width="1.2" height=".5" fill="#ffd447"/><rect x="10" y="10.6" width="1.4" height=".5" fill="#ffd447" opacity=".7"/>`;
  if(av.prop==="gamepad") r += `<rect x="7.8" y="9.4" width="4.2" height="1.9" fill="#1b2440"/><rect x="7.5" y="10.4" width="1.2" height="1.4" fill="#1b2440"/><rect x="11.1" y="10.4" width="1.2" height="1.4" fill="#1b2440"/><rect x="8.3" y="9.9" width="1.2" height=".4" fill="#19e3c8"/><rect x="8.7" y="9.5" width=".4" height="1.2" fill="#19e3c8"/><rect x="10.6" y="9.7" width=".5" height=".5" fill="#ff5fd2"/><rect x="11.2" y="10.2" width=".5" height=".5" fill="#ffd447"/>`;
  if(av.prop==="calculator") r += `<rect x="8.3" y="9" width="3.2" height="4.2" fill="#1b2440"/><rect x="8.7" y="9.4" width="2.4" height="1" fill="#3dff8b"/><rect x="8.7" y="10.8" width=".8" height=".7" fill="#d4a537"/><rect x="9.9" y="10.8" width=".8" height=".7" fill="#c8d3f5"/><rect x="8.7" y="12" width=".8" height=".7" fill="#c8d3f5"/><rect x="9.9" y="12" width=".8" height=".7" fill="#c8d3f5"/>`;
  if(av.prop==="shield") r += `<path d="M8.2 8.8 H11.8 V11 Q11.8 13 10 14 Q8.2 13 8.2 11Z" fill="#b8c4d0"/><path d="M8.8 9.4 H11.2 V11 Q11.2 12.4 10 13.2 Q8.8 12.4 8.8 11Z" fill="#14b8a6"/><rect x="9.7" y="9.8" width=".6" height="2.6" fill="#e8eef5"/><rect x="9.1" y="10.6" width="1.8" height=".6" fill="#e8eef5"/>`;
  return `<svg class="${cls||""}" viewBox="0 0 12 16" shape-rendering="crispEdges" style="--eye:${pal.e}" aria-hidden="true">${r}</svg>`;
}

/* ---------- icons ---------- */
const ICON = {
  chart: c=>`<svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="1" y="14" width="14" height="1" fill="${c}" opacity=".5"/><rect x="2" y="9" width="2" height="4" fill="#ff4d6d"/><rect x="2.5" y="7" width="1" height="7" fill="#ff4d6d"/><rect x="6" y="7" width="2" height="5" fill="${c}"/><rect x="6.5" y="5" width="1" height="8" fill="${c}"/><rect x="10" y="3" width="2" height="6" fill="${c}"/><rect x="10.5" y="1" width="1" height="10" fill="${c}"/></svg>`,
  castle: c=>`<svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="${c}"><rect x="1" y="5" width="4" height="10"/><rect x="11" y="5" width="4" height="10"/><rect x="4" y="8" width="8" height="7"/><rect x="1" y="3" width="1" height="2"/><rect x="3" y="3" width="1" height="2"/><rect x="11" y="3" width="1" height="2"/><rect x="13" y="3" width="1" height="2"/><rect x="7" y="11" width="2" height="4" fill="#0a0f1f"/><rect x="7" y="2" width="1" height="6"/><rect x="8" y="2" width="3" height="2" fill="#ffd447"/></svg>`,
  house: c=>`<svg viewBox="0 0 16 16" shape-rendering="crispEdges"><polygon points="8,1 15,8 1,8" fill="${c}"/><rect x="3" y="8" width="10" height="7" fill="#f1dcc0"/><rect x="7" y="10" width="2" height="5" fill="#7a4a2a"/><rect x="4" y="9" width="2" height="2" fill="#3de0ff"/><rect x="10" y="9" width="2" height="2" fill="#3de0ff"/><rect x="11" y="2" width="2" height="4" fill="#9b5a3a"/></svg>`,
  team: c=>`<svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="${c}"><rect x="2" y="3" width="4" height="4"/><rect x="1" y="8" width="6" height="6"/><rect x="10" y="3" width="4" height="4"/><rect x="9" y="8" width="6" height="6"/></svg>`,
  map: c=>`<svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="${c}"><polygon points="1,3 5,1 11,3 15,1 15,13 11,15 5,13 1,15" opacity=".35"/><rect x="5" y="1" width="1" height="12"/><rect x="10" y="3" width="1" height="12"/><rect x="7" y="6" width="2" height="2" fill="#ff4d6d"/></svg>`,
  bolt: c=>`<svg viewBox="0 0 16 16"><polygon points="9,1 3,9 7,9 6,15 13,6 9,6" fill="${c}"/></svg>`,
  alert: c=>`<svg viewBox="0 0 16 16" shape-rendering="crispEdges"><polygon points="8,1 15,14 1,14" fill="${c}"/><rect x="7" y="5" width="2" height="5" fill="#1a1406"/><rect x="7" y="11" width="2" height="2" fill="#1a1406"/></svg>`,
  clock: c=>`<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="${c}" stroke-width="1.6"/><path d="M8 4v4.5l3 2" stroke="${c}" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`,
  sat: c=>`<svg viewBox="0 0 32 32"><g fill="none" stroke="${c}" stroke-width="2"><circle cx="16" cy="16" r="5" fill="${c}" fill-opacity=".25"/><path d="M6 16a10 10 0 0 1 10-10M26 16a10 10 0 0 1-10 10" opacity=".8"/><path d="M2 16A14 14 0 0 1 16 2M30 16a14 14 0 0 1-14 14" opacity=".4"/></g><circle cx="16" cy="16" r="2" fill="#fff"/></svg>`,
  quest: ()=>`<svg class="quest" viewBox="0 0 4 6" shape-rendering="crispEdges"><rect x="1" y="0" width="2" height="4" fill="#ffd447"/><rect x="1" y="5" width="2" height="1" fill="#ffd447"/><rect x="0" y="0" width="1" height="4" fill="#ff9f1c"/></svg>`,
  lock: ()=>`<svg class="lock" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="4" y="2" width="8" height="2" fill="#5d6a90"/><rect x="3" y="3" width="2" height="5" fill="#5d6a90"/><rect x="11" y="3" width="2" height="5" fill="#5d6a90"/><rect x="2" y="7" width="12" height="8" fill="#3a4670"/><rect x="2" y="7" width="12" height="1" fill="#6b7aaa"/><rect x="7" y="10" width="2" height="3" fill="#0a0f1f"/></svg>`
};

/* ---------- zone art ---------- */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const ART = {
  stocks(){
    const R = rng(7), W=800, H=330, G=H-38; let s="";
    for(let i=0;i<60;i++) s+=`<rect x="${(R()*W)|0}" y="${(R()*120)|0}" width="1.2" height="1.2" fill="#bff" opacity="${.2+R()*.5}"/>`;
    // background chart line + candles
    let y=150, pts=[]; for(let x=0;x<=W;x+=12){ y+= (R()-.6)*14; y=Math.max(70,Math.min(170,y)); pts.push(x+","+y.toFixed(1)); }
    s+=`<polygon points="0,${H} ${pts.join(" ")} ${W},${H}" fill="url(#gch)" opacity=".45"/>`;
    s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="#3dff8b" stroke-width="1.6" opacity=".35"/>`;
    for(let i=0;i<23;i++){ const x=12+i*34+R()*6, top=80+R()*70, h=10+R()*22, up=R()>.4, c=up?"#3dff8b":"#ff4d6d";
      s+=`<rect x="${x+2.5}" y="${top-7}" width="1.5" height="${h+14}" fill="${c}" opacity=".22"/><rect x="${x}" y="${top}" width="6.5" height="${h}" fill="${c}" opacity=".2"/>`; }
    // far skyline
    for(let x=0;x<W;){ const w=18+R()*24, h=60+R()*80; s+=`<rect x="${x}" y="${G-h}" width="${w}" height="${h}" fill="#0b2a31"/>`; x+=w+2; }
    // near skyline with windows
    for(let x=-6;x<W;){ const w=26+R()*30, h=50+R()*80, top=G-h; s+=`<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="#0b1824" stroke="#14303c" stroke-width="1"/>`;
      if(R()>.6) s+=`<rect x="${x+w/2-1}" y="${top-12}" width="1.5" height="12" fill="#1c3a48"/><circle cx="${x+w/2-.2}" cy="${top-13}" r="1.8" fill="#ff4d6d" class="blink"/>`;
      for(let wy=top+6; wy<G-4; wy+=8) for(let wx=x+4; wx<x+w-5; wx+=6){ const r=R(); if(r>.58){ const c = r>.93?"#3dff8b":(r>.88?"#ff6b81":"#ffe9a8");
        s+=`<rect x="${wx}" y="${wy}" width="3" height="4" fill="${c}" opacity="${.3+R()*.45}" ${R()>.85?'class="twinkle" style="animation-delay:'+(R()*6).toFixed(1)+'s"':''}/>`; } }
      x+=w+3; }
    s+=`<rect x="0" y="${G}" width="${W}" height="38" fill="#071017"/><rect x="0" y="${G}" width="${W}" height="1.5" fill="#3dff8b" opacity=".35"/>`;
    for(let x=0;x<W;x+=22) s+=`<rect x="${x}" y="${G+18}" width="11" height="1.5" fill="#2a4452"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="gch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3dff8b" stop-opacity=".22"/><stop offset="1" stop-color="#3dff8b" stop-opacity="0"/></linearGradient></defs>${s}</svg>`;
  },

  for(let y=0;y<G;y+=16) s+=`<rect x="0" y="${y}" width="${W}" height="1" fill="#7c9cff" opacity=".06"/>`;
  // neural net hologram
  const nodes=[]; for(let l=0;l<4;l++) for(let i=0;i<4-(l%2);i++) nodes.push([150+l*36, 96+i*28+(l%2)*14]);
  nodes.forEach((a,i)=>nodes.forEach((b2,j)=>{ if(b2[0]-a[0]===36) s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b2[0]}" y2="${b2[1]}" stroke="#7c9cff" stroke-width=".8" opacity=".35"/>`; }));
  nodes.forEach(([x,y],i)=>s+=`<circle cx="${x}" cy="${y}" r="3.4" fill="#7af7ff" class="twinkle" style="animation-delay:${(i*0.37%3).toFixed(2)}s"/>`);
  s+=`<ellipse cx="204" cy="${G-46}" rx="80" ry="8" fill="#7c9cff" opacity=".25"/>`;

  [[18,G-150],[56,G-150],[330,G-150],[366,G-130]].forEach(([x,y])=>{ s+=`<rect x="${x}" y="${y}" width="32" height="${G-y}" fill="#141b3d" stroke="#2c3a7a"/>`;

  // scam-watch shield monitor
  s+=`<rect x="262" y="${G-104}" width="56" height="40" fill="#0d1436" stroke="#7af7ff" stroke-opacity=".6"/><path d="M290 ${G-98} l12 5 v9 q0 10 -12 15 q-12 -5 -12 -15 v-9z" fill="none" stroke="#3dff8b" stroke-width="2"/><path d="M285 ${G-84} l4 4 l7 -8" fill="none" stroke="#3dff8b" stroke-width="2"/>`;
  s+=`<rect x="286" y="${G-64}" width="8" height="10" fill="#2c3a7a"/>`;
  // desk + floor
  s+=`<rect x="110" y="${G-40}" width="220" height="8" fill="#2c3a7a"/><rect x="120" y="${G-32}" width="6" height="32" fill="#1c2656"/><rect x="314" y="${G-32}" width="6" height="32" fill="#1c2656"/>`;
  s+=`<rect x="0" y="${G}" width="${W}" height="38" fill="#080c22"/><rect x="0" y="${G}" width="${W}" height="1.5" fill="#7c9cff" opacity=".5"/>`;
  for(let x=0;x<W;x+=24) s+=`<rect x="${x}" y="${G+10}" width="12" height="1" fill="#7c9cff" opacity=".2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice">${s}</svg>`;
};

ART.games = function(){

  s+=`<circle cx="200" cy="${HZ}" r="48" fill="url(#gsun)" opacity=".9"/>`;
  for(let k=0;k<5;k++) s+=`<rect x="150" y="${HZ-30+k*6.5}" width="100" height="${1.2+k*.5}" fill="#1a0838"/>`;

  for(let i=1;i<9;i++){ const y=HZ+Math.pow(i/8,1.7)*(G-HZ); s+=`<rect x="0" y="${y.toFixed(1)}" width="${W}" height="1" fill="#c04dff" opacity="${(.2+i*.06).toFixed(2)}"/>`; }

  // pixel invader helper

    const py=y+26+h*.36; c+=`<polygon points="${x-3},${py+10} ${x+w+3},${py+10} ${x+w},${py} ${x},${py}" fill="#3a1a6a"/>`;

    c+=`<rect x="${x+w/2-6}" y="${G-22}" width="12" height="8" fill="#0a0418" stroke="${mc}" stroke-opacity=".5"/><rect x="${x+w/2-1}" y="${G-20}" width="2" height="4" fill="${mc}" opacity=".8"/>`;
    return c; };
  // cabinets: left pair + right one
  s+=cab(14,44,128,"#ff5fd2","#19e3c8",(x,y,w,h)=>inv(x+w/2-11,y+8,2,"#19e3c8")+`<rect x="${x+6}" y="${y+h-8}" width="6" height="3" fill="#ffd447" class="blink"/>`);
  s+=cab(64,40,116,"#19e3c8","#c04dff",(x,y,w,h)=>{ let q=""; for(let i=0;i<6;i++) q+=`<rect x="${x+4+i*5}" y="${y+h-10-((i*7)%13)}" width="4" height="${4+((i*7)%13)}" fill="${["#c04dff","#19e3c8","#ffd447"][i%3]}" opacity=".85"/>`; return q+`<rect x="${x+w/2-1.5}" y="${y+5}" width="3" height="3" fill="#ffffff" class="twinkle"/>`; });

/* ---------- time (Central) ---------- */
const STALE_MIN = 2*24*60, POLL_MS = 60000, GRACE_MIN = 60, DAY_START = 6, DAY_END = 21;
const MS = 60000;
function fmtCT(iso, opts){
  const d = new Date(iso); if(!iso || isNaN(d)) return "unknown";
  return new Intl.DateTimeFormat("en-US",Object.assign({timeZone:TZ,weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"},opts||{})).format(d).replace(",","") + " CT";
}
const fmtTime = d => new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"}).format(d);
function ago(iso){
  const m = Math.round((Date.now()-new Date(iso))/MS);
  if(!iso || isNaN(m)) return ""; if(m<1) return "just now"; if(m<60) return m+" min ago";
  const h=Math.round(m/60); if(h<48) return h+" h ago"; return Math.round(h/24)+" d ago";
}
function dur(iso){ const s = ago(iso); return s.replace(" ago",""); }
const updatedAt = d => d.updatedAt || d.generatedAt;
function lastActivity(d){ let best=null, bt=-Infinity;
  (d.bots||[]).forEach(b=>[b.updatedAt,b.lastRunAt].forEach(v=>{ const t=new Date(v).getTime(); if(v && !isNaN(t) && t>bt){ bt=t; best=v; } }));
  return best || updatedAt(d); }
const _ctf = new Intl.DateTimeFormat("en-US",{timeZone:TZ,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
function ctParts(date){ const p={}; _ctf.formatToParts(date).forEach(x=>p[x.type]=x.value);
  return {y:+p.year,m:+p.month,d:+p.day,hh:+p.hour%24,mm:+p.minute,ss:+p.second}; }
function ctDate(y,m,d,hh,mm){ // Central wall time -> Date
  let guess = Date.UTC(y,m-1,d,hh,mm);
  for(let i=0;i<2;i++){ const p=ctParts(new Date(guess)); const asUTC=Date.UTC(p.y,p.m-1,p.d,p.hh,p.mm); guess += Date.UTC(y,m-1,d,hh,mm)-asUTC; }
  return new Date(guess);
}
function ctDay(date, add){ const p=ctParts(date); const u=new Date(Date.UTC(p.y,p.m-1,p.d+(add||0)));
  return {y:u.getUTCFullYear(),m:u.getUTCMonth()+1,d:u.getUTCDate(),wd:(u.getUTCDay()+6)%7}; } // wd: Mon=0
function occurrences(slots, now, fromDay, toDay){ const out=[];
  for(let k=fromDay;k<=toDay;k++){ const dy=ctDay(now,k);
    (slots||[]).forEach(s=>{ if((s.days||[]).includes(dy.wd)) (s.times||[]).forEach(t=>{ const [hh,mm]=t.split(":").map(Number);
      out.push({at:ctDate(dy.y,dy.m,dy.d,hh,mm),label:s.label||"Scheduled run",day:k,hourly:(s.times||[]).length>3}); }); }); }
  return out.sort((a,b)=>a.at-b.at); }
const runsOf = b => (b.runTimes||[]).concat(b.lastRunAt?[b.lastRunAt]:[]).map(x=>new Date(x)).filter(d=>!isNaN(d));
function slotDone(at, runs, next){ const hi = Math.max(next ? +next : +at+6*3600e3, +at+GRACE_MIN*MS);
  return runs.some(r => r >= +at-30*MS && r < hi); }

/* ---------- health (mirrors publish.py) ---------- */
const HEALTH = {Healthy:{cls:"h-healthy"}, Late:{cls:"h-late"}, Quiet:{cls:"h-quiet"}};
function health(b, now){
  const slots=b.slots||[];
  if(!slots.length){ const od=/on demand|request/i.test((b.schedule||"")+" "+(b.routines||""));
    return {h:"Quiet", why: od ? "Works on demand (no schedule)" : "No scheduled runs yet"}; }
  const runs=runsOf(b), first=b.firstSeenAt?new Date(b.firstSeenAt):null;
  const occ=occurrences(slots, now, -3, 2);
  const past=occ.map((o,i)=>[o,i]).filter(([o])=> +o.at+GRACE_MIN*MS <= +now && (!first || o.at >= first));
  if(!past.length) return {h:"Healthy", why:"No runs due yet"};
  const [o,i]=past[past.length-1], nxt=occ[i+1]?occ[i+1].at:null;
  return slotDone(o.at, runs, nxt) ? {h:"Healthy", why:`Last scheduled run (${o.label}, ${fmtCT(o.at)}) checked in`}
                                   : {h:"Late", why:`No check-in for ${o.label} at ${fmtCT(o.at)}`};
}
function nextRun(now){ let best=null;
  bots.forEach(b=>{ const o=occurrences(b.slots, now, 0, 4).find(o=>o.at>now); if(o && (!best || o.at<best.at)) best={...o,bot:b}; });
  return best; }
function whenWord(at, now){ const t=fmtTime(at), a=ctDay(at), n0=ctDay(now), n1=ctDay(now,1);
  if(a.y===n0.y&&a.m===n0.m&&a.d===n0.d) return "today "+t; if(a.y===n1.y&&a.m===n1.m&&a.d===n1.d) return "tomorrow "+t;
  return new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short"}).format(at)+" "+t; }
const plural=(n,w)=>`${n} ${w}${n===1?"":"s"}`;

/* ---------- briefing (rule-based; mirrors publish.py so it stays current) ---------- */
function briefingLines(now){
  const sched=bots.filter(b=>(b.slots||[]).length), hs=Object.fromEntries(bots.map(b=>[b.id,health(b,now).h]));
  const healthy=sched.filter(b=>hs[b.id]==="Healthy").length, late=sched.filter(b=>hs[b.id]==="Late").map(b=>b.name);
  const n=inbox.length, setup=bots.filter(b=>String(b.status).toLowerCase()==="setting up").length;
  let l1 = sched.length ? `${healthy} of ${plural(sched.length,"scheduled bot")} healthy` : "No scheduled bots yet";
  if(late.length) l1 += ` (${late.join(", ")} late)`;
  l1 += " · " + (n ? `${plural(n,"item")} need${n===1?"s":""} you` : "nothing needs you");
  if(setup) l1 += ` · ${setup} setting up`;
  const nr=nextRun(now);
  const l2 = nr ? `Next run: ${nr.bot.name} · ${nr.label}, ${whenWord(nr.at,now)} CT` : "No scheduled runs in the next few days";
  const lines=[l1,l2];
  if(feed.length){ const f=feed[0], bn=(bots.find(b=>b.id===f.bot)||{}).name||"A bot";
    let t=f.text; if(t.length>90){ t=t.slice(0,87); t=t.slice(0,t.lastIndexOf(" "))+"…"; } lines.push(`Latest: ${bn}: ${t}`); }
  return lines;
}

/* ---------- today timeline ---------- */
function pct(at){ const p=ctParts(at), h=p.hh+p.mm/60; return Math.max(0,Math.min(100,(h-DAY_START)/(DAY_END-DAY_START)*100)); }
function inWindow(at){ const p=ctParts(at), h=p.hh+p.mm/60; return h>=DAY_START && h<=DAY_END; }
function sameCTDay(a,b){ const x=ctParts(a), y=ctParts(b); return x.y===y.y&&x.m===y.m&&x.d===y.d; }
function todayState(b, o, occAll, now){
  const first=b.firstSeenAt?new Date(b.firstSeenAt):null;
  if(first && o.at < first) return "skip";
  const i=occAll.findIndex(x=>+x.at===+o.at && x.label===o.label), nxt=occAll[i+1]?occAll[i+1].at:null;
  if(slotDone(o.at, runsOf(b), nxt)) return "done";
  if(+now >= +o.at + GRACE_MIN*MS) return "miss";
  if(+now >= +o.at) return "due";
  return "up";
}
const STATE_TXT = {done:"done", up:"upcoming", due:"due now", miss:"missed", skip:"before this bot was set up"};
function renderTimeline(now){
  const el=$("#timeline"), today=ctDay(now), wkend=today.wd>=5;
  const dayName=new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"long",month:"short",day:"numeric"}).format(now);
  const rows=[], counts={done:0,up:0,due:0,miss:0};
  bots.forEach(b=>{
    const occAll=occurrences(b.slots, now, -1, 2), todays=occAll.filter(o=>o.day===0);
    const ran=runsOf(b).filter(r=>sameCTDay(r,now));
    if(!(b.slots||[]).length && !ran.length) return;
    const marks=todays.map(o=>{ const s=todayState(b,o,occAll,now); if(counts[s]!=null) counts[s]++; return {o,s}; });
    rows.push({b,marks,ran,hasSlots:(b.slots||[]).length>0});
  });
  const scheduledToday=rows.some(r=>r.marks.length);
  let hoursBg=[]; for(let h=DAY_START;h<=DAY_END;h++){ hoursBg.push(`linear-gradient(90deg,transparent calc(${(h-DAY_START)/(DAY_END-DAY_START)*100}% - .5px),#ffffff${h%3===0?"14":"08"} calc(${(h-DAY_START)/(DAY_END-DAY_START)*100}% - .5px),#ffffff${h%3===0?"14":"08"} calc(${(h-DAY_START)/(DAY_END-DAY_START)*100}% + .5px),transparent calc(${(h-DAY_START)/(DAY_END-DAY_START)*100}% + .5px))`); }
  const nowP = inWindow(now) ? pct(now) : -99;
  let axis=""; for(let h=DAY_START;h<=DAY_END;h++){ if((h-DAY_START)%2 && h!==DAY_END) continue; if(Math.abs((h-DAY_START)/(DAY_END-DAY_START)*100 - nowP) < 5) continue; const lab=h===12?"12p":(h>12?(h-12)+"p":h+"a"); axis+=`<span style="left:${(h-DAY_START)/(DAY_END-DAY_START)*100}%">${lab}</span>`; }
  const rowHTML = rows.map(({b,marks,ran,hasSlots})=>{
    let inner = ran.filter(inWindow).map(r=>`<span class="mk ran" style="left:${pct(r)}%" title="${esc(b.name)} ran at ${esc(fmtTime(r))} CT"></span>`).join("");
    inner += marks.filter(m=>inWindow(m.o.at)).map(({o,s})=>`<span class="mk ${s} ${o.hourly?"sm":""}" style="left:${pct(o.at)}%" title="${esc(o.label)} · ${esc(fmtTime(o.at))} CT · ${STATE_TXT[s]}">${s==="done"?"✓":(s==="miss"?"✕":"")}</span>`).join("");
    if(!marks.length) inner += `<span class="note">${hasSlots ? (wkend ? "No runs today · weekday schedule" : "No runs scheduled today") : "On demand · ran today"}</span>`;
    return `<button class="tl-label" data-id="${esc(b.id)}">${mini(b)}<b>${esc(b.name)}</b></button><div class="tl-track">${inner}</div>`;
  }).join("");
  const off = bots.filter(b=>!rows.some(r=>r.b===b));
  const od = off.filter(b=>/on demand|request/i.test((b.schedule||"")+" "+(b.routines||""))), ns = off.filter(b=>!od.includes(b));
  const n = now, showNow = inWindow(n);
  const pills = scheduledToday
    ? `${counts.done?`<span class="pill g">${counts.done} done</span>`:""}${(counts.up+counts.due)?`<span class="pill c">${counts.up+counts.due} upcoming</span>`:""}${counts.miss?`<span class="pill r">${counts.miss} missed</span>`:""}`
    : `<span class="pill q">${wkend?"Weekend · quiet day":"Quiet day"}</span>`;
  el.innerHTML = `<div class="card-head"><span class="ico">${ICON.cal("#3de0ff")}</span><h2>Today</h2><span class="sub" style="margin-left:0">${esc(dayName)} · Central</span>
      <span class="tl-sum">${pills}</span>
      <span class="tl-legend"><span><i class="lg mk done" style="width:11px;height:11px;font-size:7px">✓</i>Done</span><span><i class="lg mk up" style="width:11px;height:11px"></i>Upcoming</span><span><i class="lg mk miss" style="width:11px;height:11px;font-size:7px">✕</i>Missed</span><span><i class="lg mk ran" style="transform:rotate(45deg);width:8px;height:8px"></i>Ran</span></span></div>
    <div class="tl-body" style="--hours:${hoursBg.join(",")}">
      ${!scheduledToday ? `<div class="quiet-banner">${wkend?"Weekend: no scheduled runs today. Weekday routines resume Monday.":"No scheduled runs today."}${rows.some(r=>r.ran.length)?" Diamonds mark runs that happened anyway.":""}</div>` : ""}
      <div class="tl-grid"><div></div><div class="tl-axis">${axis}</div>${rowHTML || `<div></div><div class="note" style="color:var(--dim);font-size:12px">No bots have a schedule yet.</div>`}
        ${showNow && rows.length ? `<div class="now" style="left:calc(164px + (100% - 164px) * ${pct(n)/100})"><span>${esc(fmtTime(n).replace(/ [AP]M$/,""))}</span></div>` : ""}</div>
      ${(od.length||ns.length)?`<div class="tl-foot">${od.length?`<span><b>ON DEMAND</b>${od.map(b=>esc(b.name)).join(", ")}</span>`:""}${ns.length?`<span><b>NOT SCHEDULED YET</b>${ns.map(b=>esc(b.name)).join(", ")}</span>`:""}</div>`:""}
    </div>`;
}

function renderLive(){ const now=new Date(); renderHUD(now); renderInbox(); renderFeed(); renderBrief(now); renderHealthBadges(now); renderTimeline(now); if(openId) fillPanel(openId); updateLive(); }
function render(){ deriveCollections(); renderWorld(); renderLive(); }

/* ---------- panel ---------- */
const panel=$("#panel"), backdrop=$("#backdrop");
let lastFocus=null;
const isEmpty = v => !v || /^no (runs|findings) yet$/i.test(v) || /^not (confirmed|scheduled)/i.test(v);
function row(k,v,raw){ return `<dt>${k}</dt><dd class="${isEmpty(v)?"empty":""}">${raw?v:esc(v||"—")}</dd>`; }
function whenText(at, text){ if(at){ const t = fmtCT(at); return text ? `${t} · ${text}` : t; } return text; }
function fillPanel(id){
  const b = botById(id); if(!b){ closePanel(); return false; }
  const z = zoneById[b.zone]||{}, s=st(b.status), L=lvl(b), col=zoneColor(z), now=new Date(), h=health(b,now);
  panel.style.setProperty("--zc",col);
  $("#pPortrait").innerHTML = sprite(b.avatar);
  $("#pZone").textContent = z.name||b.zone||"";
  $("#pName").textContent = b.name;
  $("#pCls").textContent = `${b.className||""} · LV ${L.level} · ${L.into}/${L.per} runs to next level`;
  $("#pChips").innerHTML = `<span class="chip ${s.cls}"><span class="dot ${s.cls}"></span>${esc(s.label)}</span>`+ hbHTML(b, now, true) +
    `<span class="chip">${+b.runsCompleted||0} ${(+b.runsCompleted===1)?"run":"runs"}</span>`+
    (b.created?`<span class="chip">Joined ${esc(new Date(b.created+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}))}</span>`:"");
  const w = inbox.filter(i=>i.bot===b.id);
  const occAll=occurrences(b.slots, now, -1, 2), todays=occAll.filter(o=>o.day===0);
  const todayTxt = todays.length ? todays.map(o=>`${esc(fmtTime(o.at))} ${esc(o.label)}: ${STATE_TXT[todayState(b,o,occAll,now)]}`).join("<br>") : esc((b.slots||[]).length ? "No runs scheduled today" : "Nothing scheduled");
  $("#pBody").innerHTML =
    (w.length?`<div class="wait"><h4>! WAITING ON YOU</h4><ul>${w.map(i=>`<li>${esc(i.text)}${i.since?` <span style="color:#b9925a">(${esc(dur(i.since))})</span>`:""}</li>`).join("")}</ul></div>`:"") +
    `<dl class="sheet">${row("Role",b.role)}${row("Health",`${h.h}: ${h.why}`)}${row("Schedule",b.schedule)}${row("Today",todayTxt,true)}${row("Routines",b.routines)}${row("Last run",whenText(b.lastRunAt,b.lastRun))}${row("Next run",whenText(b.nextRunAt,b.nextRunAt?"":b.nextRun))}${row("Latest finding",b.latestFinding)}${w.length?"":row("Waiting on you","Nothing right now")}${b.notes?row("Notes",b.notes):""}</dl>`+
    `<div class="p-foot">${b.updatedAt?`Bot status posted ${esc(fmtCT(b.updatedAt))}<br>`:""}Data published ${esc(fmtCT(updatedAt(D)))}</div>`;
  return true;
}
function openBot(id){
  openId = id; if(!fillPanel(id)) return;
  document.querySelectorAll(".unit").forEach(u=>u.classList.toggle("selected",u.dataset.id===id));
  if(!panel.classList.contains("open")) lastFocus = document.activeElement;
  panel.classList.add("open"); backdrop.classList.add("open"); panel.setAttribute("aria-hidden","false");
  $("#pClose").focus({preventScroll:true});
  if(location.hash !== "#bot="+id) history.replaceState(null,"","#bot="+id);
}
function closePanel(){
  openId = null;
  panel.classList.remove("open"); backdrop.classList.remove("open"); panel.setAttribute("aria-hidden","true");
  document.querySelectorAll(".unit.selected").forEach(u=>u.classList.remove("selected"));
  if(location.hash) history.replaceState(null,"",location.pathname+location.search);
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}
document.addEventListener("click",e=>{ const t=e.target.closest("[data-id]"); if(t) openBot(t.dataset.id); });
$("#pClose").onclick=closePanel; backdrop.onclick=closePanel;
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && openId) closePanel(); });

/* ---------- live data ---------- */
let fetchOk = null; // null = not tried yet, true/false = last fetch result
let lastJSON = JSON.stringify(D);
function updateLive(){
  const el = $("#live"); if(!el) return;
  const up = lastActivity(D), ageMin = (Date.now()-new Date(up))/MS;
  let cls="live", label="LIVE", tip;
  if(fetchOk === false){ cls="live off"; label = location.protocol==="file:" ? "SNAPSHOT" : "OFFLINE";
    tip = location.protocol==="file:" ? "Opened from a file, so this shows the built-in data" : "Couldn't reach data.json; showing the last data loaded"; }
  else if(!(ageMin < STALE_MIN)){ cls="live stale"; label="STALE"; tip=`No bot activity for over 2 days (last ${ago(up)})`; }
  else tip = "Connected: data refreshes every 60 seconds";
  el.className = cls; el.querySelector("b").textContent = label; el.title = tip;
  const a=$("#agoTxt"); if(a) a.textContent = ago(up);
}
async function poll(){
  if(location.protocol==="file:"){ fetchOk=false; updateLive(); return; }
  try{
    const r = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data = await r.json();
    if(!data || !Array.isArray(data.bots)) throw new Error("bad data");
    fetchOk = true;
    const j = JSON.stringify(data);
    if(j !== lastJSON){ lastJSON = j; D = data; render(); } else updateLive();
  }catch(err){ fetchOk = false; updateLive(); }
}

render();
const m = location.hash.match(/^#bot=(.+)$/); if(m) openBot(decodeURIComponent(m[1]));
poll();
setInterval(poll, POLL_MS);
setInterval(renderLive, POLL_MS);   // keeps the now-line, health, ages, and briefing current between data changes
setInterval(updateLive, 15000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) poll(); });
})();
</script>

@keyframes flyby{0%{transform:translate(-90px,96px)}100%{transform:translate(520px,40px)}}
</style>
