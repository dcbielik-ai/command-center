<style>
:root{
  --bg:#060a14; --panel:#0f1729; --panel2:#131d35; --line:#22305a; --text:#e8eeff; --muted:#8e9bc2; --dim:#5d6a90;
  --green:#3dff8b; --red:#ff4d6d; --amber:#ffb627; --cyan:#3de0ff; --purple:#b48cff; --idle:#7d8bb0;
  --mono: ui-monospace,"SFMono-Regular","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Noto Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--sans); color:var(--text);
  background:
    radial-gradient(1100px 500px at 50% -15%, #22388055, transparent 70%),
    radial-gradient(700px 400px at 0% 110%, #0f4a3533, transparent 70%),
    radial-gradient(700px 400px at 100% 110%, #4a1f6a33, transparent 70%),
    var(--bg);
  min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);
  background-size:24px 24px;}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,#00000000 0 2px,#0000001a 2px 3px);mix-blend-mode:multiply;}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}

/* ---------------- HUD ---------------- */
.hud{position:relative;z-index:2;display:flex;align-items:center;gap:18px;padding:12px 20px;
  background:linear-gradient(180deg,#101a33ee,#0b1226ee);border-bottom:1px solid var(--line);
  box-shadow:0 6px 30px #0008, 0 1px 0 #3de0ff22 inset;}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-badge{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#2a3f88,#111a38);border:1px solid #3de0ff55;
  box-shadow:0 0 16px #3de0ff44, inset 0 0 12px #3de0ff22}
.brand-badge svg{width:28px;height:28px}
.brand h1{margin:0;white-space:nowrap;font-family:var(--mono);font-size:18px;letter-spacing:.18em;font-weight:800;
  background:linear-gradient(90deg,#9ff3ff,#c8b5ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 18px #3de0ff33}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap}
.stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:flex;align-items:center;gap:9px;padding:6px 12px;border-radius:9px;background:#0a1124;
  border:1px solid var(--line);min-width:96px}
.stat .ico{width:18px;height:18px;flex:none;opacity:.9}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.stat .v{font-family:var(--mono);font-size:15px;font-weight:700;line-height:1.15;white-space:nowrap}
.stat .v small{font-size:11px;color:var(--muted);font-weight:500}
.live{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:0 5px;border-radius:4px;border:1px solid #3dff8b66;color:var(--green);letter-spacing:.12em;vertical-align:1px}
.live i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;animation:pulse 1.6s ease-in-out infinite;--c:var(--green)}
.live b{font-weight:700;font-size:9px}
.live.stale,.live.off{color:#8a93ad;border-color:#56607e}
.live.stale i,.live.off i{animation:none;box-shadow:none;opacity:.7}
.stat.alert{cursor:pointer;border-color:#ffb62777;box-shadow:0 0 14px #ffb62733;animation:alertGlow 2.2s ease-in-out infinite}
.stat.alert .v{color:var(--amber)}
.stat.alert:hover{background:#1a1608}
.stat.ok .v{color:var(--green)}
@keyframes alertGlow{50%{box-shadow:0 0 24px #ffb62766}}

/* ---------------- WORLD ---------------- */
.world{position:relative;z-index:1;flex:1;display:grid;gap:14px;padding:16px 20px 10px;
  grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(330px,1fr) auto;}
.zone{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  isolation:isolate;display:flex;flex-direction:column;min-height:330px;--zc:#3de0ff}
.zone::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--zc) 25%,transparent), inset 0 0 40px color-mix(in srgb,var(--zc) 10%,transparent)}
.zone-art{position:absolute;inset:0;z-index:-1}
.zone-art svg{width:100%;height:100%;display:block}
.zone-art::after{content:"";position:absolute;inset:0 0 auto 0;height:96px;background:linear-gradient(180deg,#000a,transparent);pointer-events:none}
.zone-head{display:flex;align-items:center;gap:10px;padding:12px 14px 0;position:relative;z-index:3}
.zone-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:#0009;border:1px solid color-mix(in srgb,var(--zc) 55%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--zc) 35%,transparent)}
.zone-icon svg{width:18px;height:18px}
.zone-head h2{margin:0;font-family:var(--mono);font-size:13.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--zc);
  text-shadow:0 0 12px color-mix(in srgb,var(--zc) 60%,transparent)}
.zone-head p{margin:2px 0 0;font-size:11.5px;color:#c7d0eccc}
.zone-count{margin-left:auto;font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:99px;background:#000a;
  border:1px solid color-mix(in srgb,var(--zc) 40%,transparent);color:#dfe6ff;white-space:nowrap}
.flag-banner{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:2px;background:var(--zc);box-shadow:0 0 8px var(--zc)}

.theme-stocks{--zc:var(--green);background:linear-gradient(180deg,#04201c 0%,#08202c 55%,#061019 100%);border-color:#1d5f4b}
.theme-hq{--zc:var(--purple);background:linear-gradient(180deg,#160f3a 0%,#120c2c 60%,#0a0918 100%);border-color:#4a3a8a}
.theme-realestate{--zc:var(--amber);background:linear-gradient(180deg,#2b1a3e 0%,#4a2c45 38%,#6b3d3a 62%,#1a3324 100%);border-color:#7a5636}

/* ticker tape */
.tape{position:relative;z-index:3;margin:10px 0 0;height:22px;overflow:hidden;background:#000a;border-block:1px solid #3dff8b33;
  font-family:var(--mono);font-size:11px;line-height:22px;white-space:nowrap;letter-spacing:.08em}
.tape-inner{display:inline-block;animation:tape 40s linear infinite}
.tape span{margin-right:28px;color:#bdf7d6}
.tape .up{color:var(--green)} .tape .dn{color:var(--red)}
@keyframes tape{to{transform:translateX(-50%)}}

/* units */
.units{position:relative;z-index:4;flex:1;display:flex;align-items:flex-end;justify-content:space-evenly;gap:10px;padding:8px 12px 16px}
.unit{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:min(190px,100%);
  border-radius:12px;padding:4px 4px 0;transition:transform .15s ease}
.unit:hover{transform:translateY(-3px)}
.unit:focus-visible{outline:2px solid var(--zc);outline-offset:3px}
.sprite-wrap{position:relative;width:64px;height:86px;display:flex;align-items:flex-end;justify-content:center}
.unit.boss .sprite-wrap{width:78px;height:104px}
.sprite{width:60px;height:80px;image-rendering:pixelated;animation:bob 2.6s ease-in-out infinite;
  filter:drop-shadow(0 0 6px color-mix(in srgb,var(--eye,#3de0ff) 45%,transparent)) drop-shadow(0 3px 0 #0006)}
.unit.boss .sprite{width:72px;height:96px}
.shadow{position:absolute;bottom:-3px;left:50%;width:46px;height:9px;margin-left:-23px;border-radius:50%;background:#0009;
  animation:shadow 2.6s ease-in-out infinite;filter:blur(1px)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.85}50%{transform:scaleX(.8);opacity:.55}}
.unit:hover .sprite{animation-duration:1.1s}
.quest{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:16px;height:24px;animation:questBob 1.1s ease-in-out infinite;
  filter:drop-shadow(0 0 6px #ffb627)}
@keyframes questBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
.ring{position:absolute;bottom:-6px;left:50%;width:62px;height:16px;margin-left:-31px;border-radius:50%;
  border:2px solid color-mix(in srgb,var(--zc) 70%,transparent);opacity:0;transition:opacity .2s}
.unit:hover .ring,.unit.selected .ring{opacity:1;animation:ring 1.4s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.12);opacity:.5}}

.plate{width:100%;background:linear-gradient(180deg,#0b1228f2,#070c1cf2);border:1px solid color-mix(in srgb,var(--zc) 40%,#22305a);
  border-radius:10px;padding:7px 9px 8px;box-shadow:0 6px 18px #0009, 0 0 14px color-mix(in srgb,var(--zc) 12%,transparent)}
.plate .name{font-weight:700;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.plate .cls{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;margin-top:2px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xprow{display:flex;align-items:center;gap:6px;margin-top:6px;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.xprow b{color:#ffe08a;font-weight:700}
.xp{flex:1;height:6px;border-radius:3px;background:#1a2442;overflow:hidden;border:1px solid #2a3866}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#ffd447,#ff9f1c);box-shadow:0 0 8px #ffd447}
.st{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}

/* status lights */
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 8px var(--c),0 0 2px var(--c)}
.s-active{--c:var(--green)} .s-working{--c:var(--cyan)} .s-needs{--c:var(--amber)} .s-setup{--c:var(--purple)} .s-idle{--c:var(--idle)}
.st.s-active{color:var(--green)} .st.s-working{color:var(--cyan)} .st.s-needs{color:var(--amber)} .st.s-setup{color:var(--purple)} .st.s-idle{color:var(--idle)}
.dot.s-active{animation:pulse 2s ease-in-out infinite}
.dot.s-needs{animation:pulse .9s ease-in-out infinite}
.dot.s-setup{animation:blink 2.8s ease-in-out infinite}
.dot.s-working{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 16px 3px var(--c);transform:scale(1.15)}}
@keyframes blink{50%{opacity:.35}}
.sprite-wrap .dot{position:absolute;top:2px;right:-4px;width:11px;height:11px;border:2px solid #050913}

/* locked zones */
.locked{grid-column:span 1;min-height:118px;border:1.5px dashed #33416d;background:
  repeating-linear-gradient(135deg,#0c1328 0 12px,#0a1022 12px 24px);display:flex;align-items:center;gap:14px;padding:14px 16px;
  border-radius:14px;color:var(--muted);position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.locked:hover{border-color:#5a6cab;transform:translateY(-2px)}
.locked::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 50%,#ffffff0d,transparent 40%),radial-gradient(circle at 70% 60%,#ffffff0a,transparent 35%);
  animation:fog 14s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(12%)}}
.locked .lock{width:44px;height:44px;flex:none;opacity:.8;position:relative}
.locked h3{margin:0;white-space:nowrap;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#aeb9dd}
.locked p{margin:4px 0 0;font-size:12px;color:var(--dim)}
.locked .plus{position:absolute;top:10px;right:10px;font-size:9px !important;font-family:var(--mono);font-size:10px;color:#7f8dbb;border:1px solid #33416d;border-radius:6px;padding:3px 7px;white-space:nowrap}

/* footer */
.foot{position:relative;z-index:2;display:flex;align-items:center;gap:16px;padding:9px 20px 12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.quests{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.quests .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--amber)}
.qitem{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:8px;background:#1d1708;border:1px solid #ffb62755;color:#ffe2a3}
.qitem:hover{background:#2a200a}
.qitem:focus-visible{outline:2px solid var(--amber)}
.quests .none{color:var(--green);font-family:var(--mono);font-size:11px}
.legend{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.note{width:100%;font-size:11px;color:var(--dim);margin-top:-2px}

/* ---------------- PANEL ---------------- */
.backdrop{position:fixed;inset:0;background:#02040acc;backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.backdrop.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:61;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(180deg,#111b34,#0a1124);border-left:1px solid color-mix(in srgb,var(--zc) 45%,#22305a);
  box-shadow:-20px 0 60px #000b, inset 1px 0 0 color-mix(in srgb,var(--zc) 25%,transparent);display:flex;flex-direction:column;--zc:var(--cyan)}
.panel.open{transform:none}
.p-head{display:flex;gap:16px;padding:20px 20px 16px;border-bottom:1px solid var(--line);position:relative}
.portrait{width:96px;height:112px;flex:none;border-radius:12px;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--zc) 25%,#0b1228),#070c1c 75%);
  border:1px solid color-mix(in srgb,var(--zc) 55%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--zc) 25%,transparent)}
.portrait svg{width:66px;height:88px;animation:bob 2.6s ease-in-out infinite;image-rendering:pixelated}
.p-title{min-width:0;flex:1}
.p-zone{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--zc)}
.p-title h2{margin:4px 0 2px;font-size:21px;line-height:1.15}
.p-cls{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  background:#0a1124;border:1px solid var(--line);text-transform:uppercase}
.chip.s-active{color:var(--green);border-color:#3dff8b55} .chip.s-needs{color:var(--amber);border-color:#ffb62766}
.chip.s-setup{color:var(--purple);border-color:#b48cff55} .chip.s-working{color:var(--cyan);border-color:#3de0ff55} .chip.s-idle{color:var(--idle)}
.close{all:unset;cursor:pointer;position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:#0a1124}
.close:hover{color:#fff;border-color:#4a5c99}
.close:focus-visible{outline:2px solid var(--zc)}
.p-body{padding:16px 20px 20px;overflow:auto;flex:1}
.wait{border:1px solid #ffb62788;background:linear-gradient(180deg,#2a1f08,#1a1406);border-radius:10px;padding:10px 12px;margin-bottom:14px;box-shadow:0 0 18px #ffb62722}
.wait h4{margin:0 0 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--amber)}
.wait ul{margin:0;padding-left:18px;color:#ffe7b3;font-size:13.5px}
.sheet{display:grid;grid-template-columns:110px 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sheet dt,.sheet dd{margin:0;padding:9px 12px;border-bottom:1px solid #1b2647;font-size:13px;line-height:1.45}
.sheet dt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);background:#0a1022;padding-top:11px}
.sheet dd{color:#dbe3fb}
.sheet dt:nth-last-of-type(1),.sheet dd:last-child{border-bottom:none}
.sheet .empty{color:var(--dim);font-style:italic}
.p-foot{margin-top:14px;font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.7;word-break:break-all}

@media (max-width:960px){
  .world{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto}
  .zone{min-height:320px}
  .stats .stat{min-width:0}
}
@media (max-width:720px){
  .world{grid-template-columns:1fr}
  .zone,.locked{grid-column:auto !important}
  .hud{flex-wrap:wrap}
  .stats{margin-left:0;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

<body>

</aside>

<script>
(function(){
"use strict";
let D = TEAM_DATA;
const TZ = (D.team && D.team.timezone) || "America/Chicago";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- status ---------- */
const STATUS = {
  "active":     {cls:"s-active",  label:"Active"},
  "working":    {cls:"s-working", label:"Working"},
  "needs you":  {cls:"s-needs",   label:"Needs you"},
  "setting up": {cls:"s-setup",   label:"Setting up"},
  "idle":       {cls:"s-idle",    label:"Idle"}
};
const st = s => STATUS[String(s||"").toLowerCase()] || {cls:"s-idle", label:s || "Idle"};

/* ---------- pixel sprites ---------- */
const BASE = [
  "..oooooooo..",
  ".ohhhhhhhho.",
  ".oheehheeho.",
  ".oheehheeho.",
  ".ohhhhhhhho.",
  ".ohhhmmhhho.",
  "..oooooooo..",
  ".oobbbbbboo.",
  "ohobbaabboho",
  "ohobbbbbboho",
  "..oobbbboo..",
  "...oo..oo..."
];
const HATS = {
  crown:       ["..t..tt..t..","..aa.aa.aa..","..aaaaaaaa..","..aaattaaa.."],
  mortarboard: ["............",".aaaaaaaaaa.","...aaaaaa.t.","...aaaaaa.t."],
  antenna:     [".....tt.....",".....oo.....",".....oo.....","....oooo...."],
  fedora:      ["............","...aaaaaa...","...aaaaata..",".aaaaaaaaaa."],
  hardhat:     ["............","....aaaa....","...aatwaa...",".aaaaaaaaaa."],
  none:        ["............","............","............","............"]
};
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const f = v => Math.max(0,Math.min(255,Math.round(v+(amt<0?v*amt:(255-v)*amt))));
  return "#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
function sprite(av, cls){
  av = av || {};
  const head = av.head||"#c8d3f5", body = av.body||"#3a6df0";
  const pal = { o:"#0a0f1f", h:head, e:av.eye||"#3de0ff", b:body, a:av.accent||"#ffd447", m:shade(head,-.45), t:av.trim||"#ff4d6d", w:"#f4f1e8" };
  const rows = (HATS[av.hat]||HATS.none).concat(BASE);
  let r = "";
  rows.forEach((row,y)=>{ for(let x=0;x<row.length;x++){ const c=row[x]; if(c===".") continue;
    let fill = pal[c]; if(c==="a" && y===8+4) fill = shade(body,.35); // body chest accent
    r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${fill}"/>`; }});
  // highlights
  r += `<rect x="2" y="5" width="2" height="1" fill="${shade(head,.45)}"/><rect x="3" y="11" width="1" height="1" fill="${shade(body,.3)}"/>`;
  return `<svg class="${cls||""}" viewBox="0 0 12 16" shape-rendering="crispEdges" style="--eye:${pal.e}" aria-hidden="true">${r}</svg>`;
}

/* ---------- icons ---------- */
const ICON = {
  chart: c=>`<svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="1" y="14" width="14" height="1" fill="${c}" opacity=".5"/><rect x="2" y="9" width="2" height="4" fill="#ff4d6d"/><rect x="2.5" y="7" width="1" height="7" fill="#ff4d6d"/><rect x="6" y="7" width="2" height="5" fill="${c}"/><rect x="6.5" y="5" width="1" height="8" fill="${c}"/><rect x="10" y="3" width="2" height="6" fill="${c}"/><rect x="10.5" y="1" width="1" height="10" fill="${c}"/></svg>`,
  castle: c=>`<svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="${c}"><rect x="1" y="5" width="4" height="10"/><rect x="11" y="5" width="4" height="10"/><rect x="4" y="8" width="8" height="7"/><rect x="1" y="3" width="1" height="2"/><rect x="3" y="3" width="1" height="2"/><rect x="11" y="3" width="1" height="2"/><rect x="13" y="3" width="1" height="2"/><rect x="7" y="11" width="2" height="4" fill="#0a0f1f"/><rect x="7" y="2" width="1" height="6"/><rect x="8" y="2" width="3" height="2" fill="#ffd447"/></svg>`,
  house: c=>`<svg viewBox="0 0 16 16" shape-rendering="crispEdges"><polygon points="8,1 15,8 1,8" fill="${c}"/><rect x="3" y="8" width="10" height="7" fill="#f1dcc0"/><rect x="7" y="10" width="2" height="5" fill="#7a4a2a"/><rect x="4" y="9" width="2" height="2" fill="#3de0ff"/><rect x="10" y="9" width="2" height="2" fill="#3de0ff"/><rect x="11" y="2" width="2" height="4" fill="#9b5a3a"/></svg>`,
  team: c=>`<svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="${c}"><rect x="2" y="3" width="4" height="4"/><rect x="1" y="8" width="6" height="6"/><rect x="10" y="3" width="4" height="4"/><rect x="9" y="8" width="6" height="6"/></svg>`,
  map: c=>`<svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="${c}"><polygon points="1,3 5,1 11,3 15,1 15,13 11,15 5,13 1,15" opacity=".35"/><rect x="5" y="1" width="1" height="12"/><rect x="10" y="3" width="1" height="12"/><rect x="7" y="6" width="2" height="2" fill="#ff4d6d"/></svg>`,
  bolt: c=>`<svg viewBox="0 0 16 16"><polygon points="9,1 3,9 7,9 6,15 13,6 9,6" fill="${c}"/></svg>`,
  alert: c=>`<svg viewBox="0 0 16 16" shape-rendering="crispEdges"><polygon points="8,1 15,14 1,14" fill="${c}"/><rect x="7" y="5" width="2" height="5" fill="#1a1406"/><rect x="7" y="11" width="2" height="2" fill="#1a1406"/></svg>`,
  clock: c=>`<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="${c}" stroke-width="1.6"/><path d="M8 4v4.5l3 2" stroke="${c}" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`,
  sat: c=>`<svg viewBox="0 0 32 32"><g fill="none" stroke="${c}" stroke-width="2"><circle cx="16" cy="16" r="5" fill="${c}" fill-opacity=".25"/><path d="M6 16a10 10 0 0 1 10-10M26 16a10 10 0 0 1-10 10" opacity=".8"/><path d="M2 16A14 14 0 0 1 16 2M30 16a14 14 0 0 1-14 14" opacity=".4"/></g><circle cx="16" cy="16" r="2" fill="#fff"/></svg>`,
  quest: ()=>`<svg class="quest" viewBox="0 0 4 6" shape-rendering="crispEdges"><rect x="1" y="0" width="2" height="4" fill="#ffd447"/><rect x="1" y="5" width="2" height="1" fill="#ffd447"/><rect x="0" y="0" width="1" height="4" fill="#ff9f1c"/></svg>`,
  lock: ()=>`<svg class="lock" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="4" y="2" width="8" height="2" fill="#5d6a90"/><rect x="3" y="3" width="2" height="5" fill="#5d6a90"/><rect x="11" y="3" width="2" height="5" fill="#5d6a90"/><rect x="2" y="7" width="12" height="8" fill="#3a4670"/><rect x="2" y="7" width="12" height="1" fill="#6b7aaa"/><rect x="7" y="10" width="2" height="3" fill="#0a0f1f"/></svg>`
};

/* ---------- zone art ---------- */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const ART = {
  stocks(){
    const R = rng(7), W=800, H=330, G=H-38; let s="";
    for(let i=0;i<60;i++) s+=`<rect x="${(R()*W)|0}" y="${(R()*120)|0}" width="1.2" height="1.2" fill="#bff" opacity="${.2+R()*.5}"/>`;
    // background chart line + candles
    let y=150, pts=[]; for(let x=0;x<=W;x+=12){ y+= (R()-.6)*14; y=Math.max(70,Math.min(170,y)); pts.push(x+","+y.toFixed(1)); }
    s+=`<polygon points="0,${H} ${pts.join(" ")} ${W},${H}" fill="url(#gch)" opacity=".45"/>`;
    s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="#3dff8b" stroke-width="1.6" opacity=".35"/>`;
    for(let i=0;i<23;i++){ const x=12+i*34+R()*6, top=80+R()*70, h=10+R()*22, up=R()>.4, c=up?"#3dff8b":"#ff4d6d";
      s+=`<rect x="${x+2.5}" y="${top-7}" width="1.5" height="${h+14}" fill="${c}" opacity=".22"/><rect x="${x}" y="${top}" width="6.5" height="${h}" fill="${c}" opacity=".2"/>`; }
    // far skyline
    for(let x=0;x<W;){ const w=18+R()*24, h=60+R()*80; s+=`<rect x="${x}" y="${G-h}" width="${w}" height="${h}" fill="#0b2a31"/>`; x+=w+2; }
    // near skyline with windows
    for(let x=-6;x<W;){ const w=26+R()*30, h=50+R()*80, top=G-h; s+=`<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="#0b1824" stroke="#14303c" stroke-width="1"/>`;
      if(R()>.6) s+=`<rect x="${x+w/2-1}" y="${top-12}" width="1.5" height="12" fill="#1c3a48"/><circle cx="${x+w/2-.2}" cy="${top-13}" r="1.8" fill="#ff4d6d" class="blink"/>`;
      for(let wy=top+6; wy<G-4; wy+=8) for(let wx=x+4; wx<x+w-5; wx+=6){ const r=R(); if(r>.58){ const c = r>.93?"#3dff8b":(r>.88?"#ff6b81":"#ffe9a8");
        s+=`<rect x="${wx}" y="${wy}" width="3" height="4" fill="${c}" opacity="${.3+R()*.45}" ${R()>.85?'class="twinkle" style="animation-delay:'+(R()*6).toFixed(1)+'s"':''}/>`; } }
      x+=w+3; }
    s+=`<rect x="0" y="${G}" width="${W}" height="38" fill="#071017"/><rect x="0" y="${G}" width="${W}" height="1.5" fill="#3dff8b" opacity=".35"/>`;
    for(let x=0;x<W;x+=22) s+=`<rect x="${x}" y="${G+18}" width="11" height="1.5" fill="#2a4452"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="gch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3dff8b" stop-opacity=".22"/><stop offset="1" stop-color="#3dff8b" stop-opacity="0"/></linearGradient></defs>${s}</svg>`;
  },
  hq(){
    const R = rng(11), W=400, H=330, G=H-38; let s=""; const OX=100;
    for(let i=0;i<80;i++) s+=`<rect x="${(R()*W)|0}" y="${(R()*170)|0}" width="${R()>.85?1.6:1}" height="${R()>.85?1.6:1}" fill="#e6dcff" class="twinkle" style="animation-delay:${(R()*5).toFixed(1)}s" opacity="${.3+R()*.6}"/>`;
    s+=`<circle cx="266" cy="60" r="11" fill="#efe6ff" opacity=".9"/><circle cx="271" cy="57" r="10" fill="#160f3a"/>`;
    s+=`<path d="M0 ${G-40} Q60 ${G-70} 120 ${G-46} T260 ${G-50} T400 ${G-44} V${H} H0Z" fill="#1b1440"/>`;
    for(const [a,b] of [[0,126],[274,400]]){ s+=`<rect x="${a}" y="${G-46}" width="${b-a}" height="46" fill="#231a52" stroke="#3a2d80"/>`; for(let x=a;x<b;x+=12) s+=`<rect x="${x+1}" y="${G-53}" width="7" height="7" fill="#231a52" stroke="#3a2d80"/>`; }
    for(const x of [40,82,318,360]) s+=`<rect x="${x}" y="${G-30}" width="3" height="10" fill="#5a3a22"/><circle cx="${x+1.5}" cy="${G-33}" r="3.5" fill="#ffb627" class="beacon"/>`;
    s+=`<g transform="translate(${OX},0)">`;
    const c="#2a2060", cl="#3a2d80", roof="#7b5cff", top=G-150;
    s+=`<circle cx="100" cy="${top-6}" r="20" fill="url(#beam)" class="beacon"/>`;
    [[22,top+40],[148,top+40]].forEach(([x,y])=>{ s+=`<rect x="${x}" y="${y}" width="30" height="${G-y}" fill="${c}" stroke="${cl}"/>`;
      s+=`<polygon points="${x-4},${y} ${x+15},${y-28} ${x+34},${y}" fill="${roof}"/>`;
      s+=`<rect x="${x+14}" y="${y-42}" width="1.6" height="15" fill="#cbb8ff"/><polygon points="${x+15.6},${y-42} ${x+27},${y-38.5} ${x+15.6},${y-35}" fill="#ffd447" class="flag"/>`;
      s+=`<rect x="${x+11}" y="${y+16}" width="8" height="10" fill="#ffd447" opacity=".85"/><rect x="${x+11}" y="${y+48}" width="8" height="10" fill="#ffd447" opacity=".55"/>`; });
    s+=`<rect x="48" y="${top+30}" width="104" height="${G-top-30}" fill="${c}" stroke="${cl}"/>`;
    for(let x=48;x<152;x+=14) s+=`<rect x="${x}" y="${top+21}" width="9" height="9" fill="${c}" stroke="${cl}"/>`;
    s+=`<rect x="86" y="${top}" width="28" height="31" fill="${c}" stroke="${cl}"/><rect x="95" y="${top+8}" width="10" height="12" fill="#3de0ff" opacity=".9"/>`;
    [[60,top+46],[130,top+46]].forEach(([x,y])=>s+=`<rect x="${x}" y="${y}" width="10" height="13" fill="#ffd447" opacity=".75"/>`);
    s+=`<path d="M80 ${G} V${G-34} a20 20 0 0 1 40 0 V${G} Z" fill="#0d0a22" stroke="${cl}"/></g>`;
    s+=`<rect x="0" y="${G}" width="${W}" height="38" fill="#110c28"/><rect x="0" y="${G}" width="${W}" height="1.5" fill="#b48cff" opacity=".35"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice"><defs><radialGradient id="beam"><stop offset="0" stop-color="#3de0ff" stop-opacity=".7"/><stop offset="1" stop-color="#3de0ff" stop-opacity="0"/></radialGradient></defs>${s}</svg>`;
  },
  realestate(){
    const R = rng(5), W=400, H=330, G=H-38; let s=""; const OX=100;
    s+=`<g transform="translate(${OX},0)"><circle cx="46" cy="${G-110}" r="26" fill="#ffb15c" opacity=".9"/><circle cx="46" cy="${G-110}" r="40" fill="#ffb15c" opacity=".14"/>`;
    s+=`<g class="cloud"><ellipse cx="150" cy="70" rx="20" ry="5" fill="#f6c7b0" opacity=".3"/><ellipse cx="164" cy="66" rx="12" ry="5" fill="#f6c7b0" opacity=".3"/></g>`;
    s+=`</g><path d="M0 ${G-84} Q70 ${G-110} 140 ${G-90} T280 ${G-92} T400 ${G-86} V${H} H0Z" fill="#2c5a3b"/><path d="M0 ${G-52} Q80 ${G-72} 170 ${G-56} T330 ${G-60} T400 ${G-54} V${H} H0Z" fill="#244b31"/><g transform="translate(${OX},0)">`;
    const house=(x,y,w,body,roof,door)=>{ const h=w*.7;
      return `<rect x="${x}" y="${y-h}" width="${w}" height="${h}" fill="${body}"/><polygon points="${x-3},${y-h} ${x+w/2},${y-h-w*.5} ${x+w+3},${y-h}" fill="${roof}"/>`+
        `<rect x="${x+w*.41}" y="${y-h*.55}" width="${w*.18}" height="${h*.55}" fill="${door}"/>`+
        `<rect x="${x+w*.12}" y="${y-h*.78}" width="${w*.18}" height="${w*.16}" fill="#ffe9a8" class="twinkle" style="animation-delay:${(R()*5).toFixed(1)}s"/>`+
        `<rect x="${x+w*.7}" y="${y-h*.78}" width="${w*.18}" height="${w*.16}" fill="#ffe9a8" opacity=".8"/>`; };
    const tree=(x,y,r)=>`<rect x="${x-1.5}" y="${y-7}" width="3" height="9" fill="#5a3a22"/><circle cx="${x}" cy="${y-12}" r="${r}" fill="#2f7a46"/><circle cx="${x-2.5}" cy="${y-14.5}" r="${r*.55}" fill="#3e9a5a"/>`;
    s+=house(74,G-74,24,"#d8c0e8","#5a3b7a","#3a2a3a")+house(128,G-70,26,"#f0c9a0","#8a3b3b","#5a2a1a");
    s+=tree(112,G-62,7)+tree(64,G-66,6);
    s+=house(10,G-8,38,"#e8d6c0","#b5523b","#6b3a22")+house(150,G-10,40,"#cfe0f0","#4a5e8a","#3a2a1a");
    s+=tree(58,G-4,9)+tree(196,G-2,8);
    s+=`</g>`;
    s+=house(6,G-78,22,"#cfe8d8","#3b6a5a","#2a3a2a")+house(330,G-76,24,"#e8e0c8","#9a5a2a","#4a2a1a")+tree(40,G-70,7)+tree(372,G-68,7);
    s+=house(30,G-8,40,"#f0d8c8","#7a3b5a","#4a2a2a")+house(316,G-8,42,"#d8e4c8","#5a7a3b","#3a2a1a")+tree(86,G-3,9)+tree(14,G-3,8)+tree(302,G-3,8)+tree(380,G-2,9);
    s+=`<g transform="translate(${OX},0)">`;
    s+=`<rect x="112" y="${G-22}" width="1.6" height="22" fill="#7a5a3a"/><rect x="100" y="${G-24}" width="26" height="11" fill="#f4f1e8" stroke="#c8483f" stroke-width="1.2"/><text x="113" y="${G-16.2}" font-size="5.6" font-family="monospace" font-weight="700" fill="#c8483f" text-anchor="middle">SALE</text></g>`;
    s+=`<rect x="0" y="${G}" width="${W}" height="38" fill="#1a2a1e"/><rect x="0" y="${G}" width="${W}" height="1.5" fill="#ffb627" opacity=".35"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice">${s}</svg>`;
  }
};

/* ---------- time ---------- */
const STALE_MIN = 30, POLL_MS = 60000;
function fmtCT(iso, opts){
  const d = new Date(iso); if(!iso || isNaN(d)) return "unknown";
  return new Intl.DateTimeFormat("en-US",Object.assign({timeZone:TZ,weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"},opts||{})).format(d).replace(",","") + " CT";
}
function ago(iso){
  const m = Math.round((Date.now()-new Date(iso))/60000);
  if(!iso || isNaN(m)) return ""; if(m<1) return "just now"; if(m<60) return m+" min ago";
  const h=Math.round(m/60); if(h<48) return h+" h ago"; return Math.round(h/24)+" d ago";
}
const updatedAt = d => d.updatedAt || d.generatedAt;

/* ---------- render ---------- */
const ZC = {stocks:"#3dff8b", hq:"#b48cff", realestate:"#ffb627"};
const zoneColor = z => (z && (z.color || ZC[z.theme])) || "#3de0ff";
const TAPE = ["FUNDAMENTALS","EARNINGS","MARGINS","FREE CASH FLOW","INSIDER BUYS","BREAKOUTS","KEY LEVELS","RSI · MACD","PORTFOLIO NEWS","SEC FILINGS"];
let bots=[], zones=[], locked=[], zoneById={}, waiting=[], openId=null, XP={xpPerRun:1,runsPerLevel:5};
function lvl(b){ const runs = +b.runsCompleted||0, per = XP.runsPerLevel||5; return {level:1+Math.floor(runs/per), into:runs%per, per}; }
function statBox(icon, k, v, extra){ return `<div class="stat ${extra&&extra.cls||""}" ${extra&&extra.attrs||""}><span class="ico">${icon}</span><div><div class="k">${k}</div><div class="v">${v}</div></div></div>`; }
function unitHTML(b){
  const s = st(b.status), L = lvl(b), pct = Math.round(L.into/L.per*100);
  const q = (b.waitingOnYou||[]).length ? ICON.quest() : "";
  return `<button class="unit ${b.boss?"boss":""} ${b.id===openId?"selected":""}" data-id="${esc(b.id)}" aria-label="${esc(b.name)}, ${esc(s.label)}. Open details">
    <div class="sprite-wrap">${q}<div class="ring"></div><div class="shadow"></div>${sprite(b.avatar,"sprite")}<span class="dot ${s.cls}"></span></div>
    <div class="plate">
      <div class="name">${esc(b.name)}</div>
      <div class="cls">${esc(b.className||"")}</div>
      <div class="xprow"><b>LV ${L.level}</b><div class="xp"><i style="width:${pct}%"></i></div><span>${L.into}/${L.per} runs</span></div>
      <div class="st ${s.cls}"><span class="dot ${s.cls}"></span>${esc(s.label)}</div>
    </div></button>`;
}
let artCache = {};
function render(){
  bots = D.bots||[]; zones = D.zones||[]; locked = D.lockedSlots||[]; XP = D.xpRule || XP;
  zoneById = Object.fromEntries(zones.map(z=>[z.id,z]));
  waiting = bots.flatMap(b => (b.waitingOnYou||[]).map(t=>({bot:b,text:t})));
  const activeCount = bots.filter(b=>["active","working"].includes(String(b.status).toLowerCase())).length;
  $("#brandBadge").innerHTML = ICON.sat("#9ff3ff");
  $("#subtitle").textContent = `${(D.team&&D.team.name)||"Team"} · ${(D.team&&D.team.owner)||""}'s AI bot squad`;
  const up = updatedAt(D);
  $("#stats").innerHTML =
    statBox(ICON.team("#9ff3ff"),"Team size", `${bots.length} <small>bots</small>`) +
    statBox(ICON.map("#c8b5ff"),"Zones", `${zones.length} <small>+${locked.length} locked</small>`) +
    statBox(ICON.bolt("#3dff8b"),"Bots active", `${activeCount}<small>/${bots.length}</small>`, {cls:"ok"}) +
    statBox(ICON.alert(waiting.length?"#ffb627":"#3dff8b"),"Needs you", `${waiting.length} <small>${waiting.length===1?"item":"items"}</small>`,
            waiting.length?{cls:"alert",attrs:`role="button" tabindex="0" id="needsBtn" title="Show what needs you"`}:{cls:"ok"}) +
    statBox(ICON.clock("#9ff3ff"),`Last updated <span id="live" class="live"><i></i><b>LIVE</b></span>`, `${esc(fmtCT(up))} <small id="agoTxt">${esc(ago(up))}</small>`);
  let html = "";
  zones.forEach(z=>{
    const zb = bots.filter(b=>b.zone===z.id), col = zoneColor(z);
    const tape = z.theme==="stocks" ? `<div class="tape" aria-hidden="true"><div class="tape-inner">${TAPE.concat(TAPE).map((t,j)=>`<span><span class="${j%TAPE.length%3===2?"dn":"up"}">${j%TAPE.length%3===2?"▼":"▲"}</span> ${t}</span>`).join("")}</div></div>` : "";
    const art = artCache[z.theme] || (artCache[z.theme] = (ART[z.theme]||(()=>""))());
    html += `<section class="zone theme-${esc(z.theme)}" style="grid-column:span ${+z.span||1};--zc:${col}" aria-label="${esc(z.name)} zone">
      <div class="zone-art">${art}</div>
      <header class="zone-head"><span class="zone-icon">${(ICON[z.icon]||ICON.map)(col)}</span>
        <div><h2>${esc(z.name)}</h2><p>${esc(z.tagline||"")}</p></div>
        <span class="zone-count"><span class="flag-banner"></span>${zb.length} ${zb.length===1?"bot":"bots"}</span></header>
      ${tape}
      <div class="units">${zb.map(unitHTML).join("") || `<p style="color:var(--muted)">No bots stationed yet</p>`}</div>
    </section>`;
  });
  locked.forEach(l=>{
    html += `<div class="locked" title="Coming soon">${ICON.lock()}<div style="position:relative"><h3>${esc(l.title||"Unlock new zone")}</h3><p>${esc(l.hint||"Coming soon")}</p></div><span class="plus">COMING SOON</span></div>`;
  });
  $("#world").innerHTML = html;
  $("#quests").innerHTML = `<span class="lbl">QUEST LOG</span>` + (waiting.length
    ? waiting.map(w=>`<button class="qitem" data-id="${esc(w.bot.id)}"><span class="dot s-needs"></span><b>${esc(w.bot.name)}:</b> ${esc(w.text)}</button>`).join("")
    : `<span class="none">All clear. Nothing needs you right now.</span>`);
  $("#legend").innerHTML = Object.values(STATUS).map(s=>`<span><span class="dot ${s.cls}"></span>${s.label}</span>`).join("");
  $("#note").textContent = D.dataNote || "";
  const nb=$("#needsBtn"); if(nb){ const go=()=>openBot(waiting[0].bot.id); nb.onclick=go; nb.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();} }; }
  if(openId) fillPanel(openId);
  updateLive();
}

/* ---------- panel ---------- */
const panel=$("#panel"), backdrop=$("#backdrop");
let lastFocus=null;
const isEmpty = v => !v || /^no (runs|findings) yet$/i.test(v) || /^not (confirmed|scheduled)/i.test(v);
function row(k,v){ return `<dt>${k}</dt><dd class="${isEmpty(v)?"empty":""}">${esc(v||"—")}</dd>`; }
function whenText(at, text){ if(at){ const t = fmtCT(at); return text ? `${t} · ${text}` : t; } return text; }
function fillPanel(id){
  const b = bots.find(x=>x.id===id); if(!b){ closePanel(); return false; }
  const z = zoneById[b.zone]||{}, s=st(b.status), L=lvl(b), col=zoneColor(z);
  panel.style.setProperty("--zc",col);
  $("#pPortrait").innerHTML = sprite(b.avatar);
  $("#pZone").textContent = z.name||b.zone||"";
  $("#pName").textContent = b.name;
  $("#pCls").textContent = `${b.className||""} · LV ${L.level} · ${L.into}/${L.per} runs to next level`;
  $("#pChips").innerHTML = `<span class="chip ${s.cls}"><span class="dot ${s.cls}"></span>${esc(s.label)}</span>`+
    `<span class="chip">${+b.runsCompleted||0} ${(+b.runsCompleted===1)?"run":"runs"}</span>`+
    (b.created?`<span class="chip">Joined ${esc(new Date(b.created+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}))}</span>`:"");
  const w = b.waitingOnYou||[];
  $("#pBody").innerHTML =
    (w.length?`<div class="wait"><h4>! WAITING ON YOU</h4><ul>${w.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:"") +
    `<dl class="sheet">${row("Role",b.role)}${row("Schedule",b.schedule)}${row("Routines",b.routines)}${row("Last run",whenText(b.lastRunAt,b.lastRun))}${row("Next run",whenText(b.nextRunAt,b.nextRunAt?"":b.nextRun))}${row("Latest finding",b.latestFinding)}${w.length?"":row("Waiting on you","Nothing right now")}${b.notes?row("Notes",b.notes):""}</dl>`+
    `<div class="p-foot">${b.updatedAt?`Bot status posted ${esc(fmtCT(b.updatedAt))}<br>`:""}Data as of ${esc(fmtCT(updatedAt(D)))}</div>`;
  return true;
}
function openBot(id){
  openId = id; if(!fillPanel(id)) return;
  document.querySelectorAll(".unit").forEach(u=>u.classList.toggle("selected",u.dataset.id===id));
  if(!panel.classList.contains("open")) lastFocus = document.activeElement;
  panel.classList.add("open"); backdrop.classList.add("open"); panel.setAttribute("aria-hidden","false");
  $("#pClose").focus({preventScroll:true});
  if(location.hash !== "#bot="+id) history.replaceState(null,"","#bot="+id);
}
function closePanel(){
  openId = null;
  panel.classList.remove("open"); backdrop.classList.remove("open"); panel.setAttribute("aria-hidden","true");
  document.querySelectorAll(".unit.selected").forEach(u=>u.classList.remove("selected"));
  if(location.hash) history.replaceState(null,"",location.pathname+location.search);
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}
document.addEventListener("click",e=>{ const t=e.target.closest("[data-id]"); if(t) openBot(t.dataset.id); });
$("#pClose").onclick=closePanel; backdrop.onclick=closePanel;
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && openId) closePanel(); });

/* ---------- live data ---------- */
let fetchOk = null; // null = not tried yet, true/false = last fetch result
let lastJSON = JSON.stringify(D);
function updateLive(){
  const el = $("#live"); if(!el) return;
  const up = updatedAt(D), ageMin = (Date.now()-new Date(up))/60000;
  let cls="live", label="LIVE", tip;
  if(fetchOk === false){ cls="live off"; label = location.protocol==="file:" ? "SNAPSHOT" : "OFFLINE";
    tip = location.protocol==="file:" ? "Opened from a file, so this shows the built-in data" : "Couldn't reach data.json; showing the last data loaded"; }
  else if(!(ageMin < STALE_MIN)){ cls="live stale"; label="STALE"; tip=`Data is ${ago(up)} old (no bot updates in the last ${STALE_MIN} min)`; }
  else tip = "Data refreshes every 60 seconds";
  el.className = cls; el.querySelector("b").textContent = label; el.title = tip;
  const a=$("#agoTxt"); if(a) a.textContent = ago(up);
}
async function poll(){
  if(location.protocol==="file:"){ fetchOk=false; updateLive(); return; }
  try{
    const r = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data = await r.json();
    if(!data || !Array.isArray(data.bots)) throw new Error("bad data");
    fetchOk = true;
    const j = JSON.stringify(data);
    if(j !== lastJSON){ lastJSON = j; D = data; render(); } else updateLive();
  }catch(err){ fetchOk = false; updateLive(); }
}

render();
const m = location.hash.match(/^#bot=(.+)$/); if(m) openBot(decodeURIComponent(m[1]));
poll();
setInterval(poll, POLL_MS);
setInterval(updateLive, 15000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) poll(); });
})();
</script>
<style>
.twinkle{animation:twinkle 3.5s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.12}}
.blink{animation:blink 1.6s steps(2) infinite}
.flag{transform-box:fill-box;transform-origin:left center;animation:flag 1.4s ease-in-out infinite}
@keyframes flag{50%{transform:scaleX(.75) skewY(4deg)}}
.beacon{transform-box:fill-box;transform-origin:center;animation:beacon 2.4s ease-in-out infinite}
@keyframes beacon{50%{transform:scale(1.35);opacity:.6}}
.cloud{animation:cloud 18s ease-in-out infinite alternate}
@keyframes cloud{to{transform:translateX(-40px)}}
</style>
</body>
</html>
